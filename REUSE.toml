version = 1

# JSON admits no comment syntax, so these files carry their copyright and
# licence information here rather than in a header.
[[annotations]]
path = ["package.json", "package-lock.json", "tsconfig.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Generated by 'npm run build' from src/. Committed because GitHub runs a
# composite action straight from the repository, with no build step
# available. The CI workflow rebuilds it and fails if the result differs,
# so it cannot drift from the sources it is built from.
[[annotations]]
path = ["dist/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Captured verbatim from a real 'npm publish --json --dry-run' run whose
# lifecycle scripts write to stdout. Kept as-is so the parser is tested
# against npm's actual output rather than a hand-written approximation.
[[annotations]]
path = ["test/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"
