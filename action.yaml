---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# node-publish-action
name: "🚀 Node.js Package Publish"
# yamllint disable-line rule:line-length
description: "Publishes a package to an npm registry, stamping the version into package.json or taking an already-packed tarball"
# Composes node-create-npmrc-action for registry authentication, then
# runs 'npm version' and 'npm publish' with verification. The npmrc
# action registers a guaranteed post-job step that scrubs the
# credential file, so this action adds no duplicate cleanup. Dry-run
# mode skips the credential machinery entirely and performs a local
# packing exercise with 'npm publish --dry-run'.

inputs:
  # Mandatory
  publish_version:
    # yamllint disable-line rule:line-length
    description: "Version to stamp and publish, such as '1.2.3' or '1.2.3-SNAPSHOT'; characters 0-9 A-Z a-z . -"
    required: true
  # Optional
  registry_url:
    # yamllint disable-line rule:line-length
    description: "Target npm registry URL ending with '/'; required unless dry_run is 'true'; characters A-Z a-z 0-9 . : / _ -"
    required: false
    default: ""
  dry_run:
    # yamllint disable-line rule:line-length
    description: "Pack and verify without publishing ('true'/'false'); npm may still read the registry; skips credential setup"
    required: false
    default: "false"
  path_prefix:
    description: "Project directory; must resolve within the workspace"
    required: false
    default: "."
  tarball_path:
    # yamllint disable-line rule:line-length
    description: "Publish this already-packed .tgz instead of packing the project directory; must resolve within the workspace and carry publish_version. Skips the version stamp"
    required: false
    default: ""
  node_version:
    # yamllint disable-line rule:line-length
    description: "Node.js version to set up, such as '22', '22.x' or 'lts/*'; characters A-Z a-z 0-9 . * / _ -"
    required: false
    default: "22"
  node_version_file:
    # yamllint disable-line rule:line-length
    description: "File containing the Node.js version, such as '.nvmrc'; takes precedence over node_version; must resolve within the workspace"
    required: false
    default: ""
  tag:
    # yamllint disable-line rule:line-length
    description: "npm distribution tag; characters A-Z a-z 0-9 . _ -"
    required: false
    default: "latest"
  access:
    description: "Package access: 'public', 'restricted' or unset"
    required: false
    default: ""
  provenance:
    # yamllint disable-line rule:line-length
    description: "Generate registry-native provenance ('true'/'false'); needs a registry with Sigstore provenance support (npmjs.org) plus OIDC; Nexus lacks support"
    required: false
    default: "false"
  # Credential pass-through for node-create-npmrc-action (unused in
  # dry-run mode). Two mutually exclusive authentication modes:
  # Basic auth (nexus_user/nexus_password or load_credential), or a
  # bearer token (auth_token).
  nexus_user:
    # yamllint disable-line rule:line-length
    description: "Basic auth username (default: calling repository name); ignored when auth_token selects token authentication"
    required: false
    default: ""
  nexus_password:
    # yamllint disable-line rule:line-length
    description: "Registry password/token; required for non-dry-run publishes unless load_credential is 'true'"
    required: false
    default: ""
  auth_token:
    # yamllint disable-line rule:line-length
    description: "Bearer token written as '_authToken'; use for registries that reject Basic auth (for example registry.npmjs.org). Excludes nexus_password and load_credential; nexus_user is ignored"
    required: false
    default: ""
  load_credential:
    # yamllint disable-line rule:line-length
    description: "Fetch the password from 1Password via credential-load-action ('true'/'false')"
    required: false
    default: "false"
  vault_mapping_json:
    # yamllint disable-line rule:line-length
    description: "JSON mapping repository owner to 1Password vault (used when load_credential is 'true')"
    required: false
    default: ""
  op_service_account_token:
    # yamllint disable-line rule:line-length
    description: "1Password service account token (used when load_credential is 'true')"
    required: false
    default: ""
  scope:
    description: "npm scope for the auth entry (for example '@onap')"
    required: false
    default: ""

outputs:
  published_version:
    # yamllint disable-line rule:line-length
    description: "Published version; stamped into package.json unless tarball_path supplied it"
    value: ${{ steps.publish.outputs.published_version }}
  package_name:
    description: "Package name from the publish metadata"
    value: ${{ steps.publish.outputs.package_name }}
  tarball_name:
    description: "Tarball filename from the publish metadata"
    value: ${{ steps.publish.outputs.tarball_name }}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_PUBLISH_VERSION: ${{ inputs.publish_version }}
        INPUT_REGISTRY_URL: ${{ inputs.registry_url }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_TARBALL_PATH: ${{ inputs.tarball_path }}
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node_version_file }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ACCESS: ${{ inputs.access }}
        INPUT_PROVENANCE: ${{ inputs.provenance }}
        INPUT_LOAD_CREDENTIAL: ${{ inputs.load_credential }}
        INPUT_NEXUS_USER: ${{ inputs.nexus_user }}
        INPUT_NEXUS_PASSWORD: ${{ inputs.nexus_password }}
        INPUT_AUTH_TOKEN: ${{ inputs.auth_token }}
        INPUT_VAULT_MAPPING_JSON: ${{ inputs.vault_mapping_json }}
        INPUT_OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op_service_account_token }}
      run: |
        # Validate inputs
        # Preflight: fail with a clear message when required tools are
        # missing (possible on minimal self-hosted runners)
        for tool in jq realpath mktemp tr tar cp; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            echo "This action requires jq, realpath (GNU coreutils,"
            echo "including -m), mktemp, tr, tar and cp on the runner"
            exit 1
          fi
        done
        # A workspace selector is at odds with this action's
        # contract: it publishes the single package at path_prefix,
        # verifies one version and reports one result. A selector can
        # match several packages, and npm would publish them all
        # before anything here could object -- irreversibly. Reject
        # it up front and point at the input that expresses the same
        # intent unambiguously.
        #
        # npm matches the npm_config_ prefix case insensitively, so
        # fold before comparing.
        while IFS= read -r env_name; do
          case "$(printf '%s' "${env_name}" \
            | tr '[:upper:]' '[:lower:]')" in
            npm_config_workspace)
              # npm's loadEnv skips empty values outright, so an
              # exported but empty selector selects nothing and must
              # not be treated as one.
              if [ -n "${!env_name}" ]; then
                echo "Error: a workspace is selected through" \
                  "${env_name} ❌"
                echo "This action publishes one package. Point"
                echo "path_prefix at the workspace package instead."
                exit 1
              fi ;;
          esac
        done < <(compgen -e)
        # The action requires GNU realpath -m (missing-path
        # resolution); BSD/macOS realpath lacks it, and failing here
        # gives a clearer error than a mid-run failure
        if ! realpath -m -- / > /dev/null 2>&1; then
          echo "Error: realpath does not support the -m option ❌"
          echo "This action requires GNU coreutils realpath"
          exit 1
        fi
        # The workspace boundary checks depend on these runner
        # environment variables: an empty value would degrade the
        # case patterns to /* and disable the escape checks
        for dir_var in GITHUB_WORKSPACE RUNNER_TEMP; do
          dir_value="${!dir_var:-}"
          if [ -z "${dir_value}" ] || [ ! -d "${dir_value}" ]; then
            echo "Error: ${dir_var} not set to a directory ❌"
            echo "This action requires a standard runner environment"
            exit 1
          fi
        done
        # A case glob validates the entire string, including embedded
        # newlines; grep would only validate per line
        case "${INPUT_DRY_RUN}" in
          true|false) ;;
          *)
            echo "Error: dry_run must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_PROVENANCE}" in
          true|false) ;;
          *)
            echo "Error: provenance must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_LOAD_CREDENTIAL}" in
          true|false) ;;
          *)
            echo "Error: load_credential must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_ACCESS}" in
          ''|public|restricted) ;;
          *)
            echo "Error: invalid access ❌"
            echo "Expected: 'public', 'restricted' or unset"
            exit 1 ;;
        esac
        # Restrict the distribution tag to a safe character set; the
        # value becomes an npm publish argument
        case "${INPUT_TAG}" in
          *[!A-Za-z0-9._-]*|'')
            echo "Error: invalid tag ❌"
            echo "Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1 ;;
        esac
        # The version needs a strict allowlist (no shell
        # metacharacters, no whitespace, no embedded newlines) plus a
        # structural check for three all-digit, dot-separated
        # segments; a '-' suffix such as '-SNAPSHOT' or '-rc.1' may
        # follow the third segment
        case "${INPUT_PUBLISH_VERSION}" in
          *[!0-9A-Za-z.-]*|'')
            echo "Error: invalid publish_version ❌"
            echo "Allowed characters: 0-9 A-Z a-z . -"
            exit 1 ;;
        esac
        version_error() {
          echo "Error: invalid publish_version ❌"
          echo "Expected a semver-style version such as 1.2.3,"
          echo "1.2.3-SNAPSHOT or 1.2.3-rc.1"
          exit 1
        }
        case "${INPUT_PUBLISH_VERSION}" in
          *.*.*) ;;
          *) version_error ;;
        esac
        major="${INPUT_PUBLISH_VERSION%%.*}"
        minor_rest="${INPUT_PUBLISH_VERSION#*.}"
        minor="${minor_rest%%.*}"
        rest="${minor_rest#*.}"
        patch="${rest%%-*}"
        # MAJOR, MINOR and PATCH must contain digits alone; the
        # allowlist above already constrains any suffix after the
        # first '-'
        for segment in "${major}" "${minor}" "${patch}"; do
          case "${segment}" in
            ''|*[!0-9]*) version_error ;;
          esac
        done
        # The registry URL is mandatory for real publishes; dry-run
        # mode publishes nothing, so it needs none. Validate any provided
        # value: https scheme, trailing slash, non-empty host and a
        # character allowlist that excludes whitespace, userinfo
        # separators and shell metacharacters
        if [ "${INPUT_DRY_RUN}" != "true" ] && \
          [ -z "${INPUT_REGISTRY_URL}" ]; then
          echo "Error: registry_url required unless dry_run ❌"
          exit 1
        fi
        if [ -n "${INPUT_REGISTRY_URL}" ]; then
          case "${INPUT_REGISTRY_URL}" in
            *[!A-Za-z0-9.:/_-]*)
              echo "Error: invalid registry_url characters ❌"
              echo "Allowed characters: A-Z a-z 0-9 . : / _ -"
              exit 1 ;;
          esac
          case "${INPUT_REGISTRY_URL}" in
            https://?*/) ;;
            *)
              echo "Error: invalid registry_url ❌"
              echo "Expected https://<host>/<path>/ with a"
              echo "trailing slash"
              exit 1 ;;
          esac
          case "${INPUT_REGISTRY_URL}" in
            https:///*)
              echo "Error: registry_url must include a host ❌"
              exit 1 ;;
          esac
        fi
        # Exactly one authentication mode. Basic auth folds a
        # password into an .npmrc entry and token auth writes a
        # bearer token, so accepting both would leave the effective
        # credential ambiguous.
        modes=0
        if [ -n "${INPUT_AUTH_TOKEN}" ]; then
          modes=$((modes + 1))
        fi
        if [ "${INPUT_LOAD_CREDENTIAL}" = "true" ] || \
          [ -n "${INPUT_NEXUS_PASSWORD}" ]; then
          modes=$((modes + 1))
        fi
        if [ "${modes}" -gt 1 ]; then
          echo "Error: conflicting authentication modes ❌"
          echo "Choose one of: auth_token, or Basic auth"
          echo "(nexus_password or load_credential)"
          exit 1
        fi
        # Real publishes need a credential source; failing here gives
        # a clearer error than a mid-publish authentication failure
        if [ "${INPUT_DRY_RUN}" != "true" ] && [ "${modes}" -eq 0 ]; then
          echo "Error: no registry credential configured ❌"
          echo "Provide nexus_password, set load_credential to 'true'"
          echo "(with vault_mapping_json and"
          echo "op_service_account_token), or provide auth_token"
          exit 1
        fi
        # nexus_user is a Basic auth username and carries no secret,
        # so it does not select a mode and does not conflict with
        # one. Callers computing it unconditionally (matrix publishes
        # that mix Nexus and npmjs targets) would break if this
        # rejected, so say it is ignored rather than fail.
        if [ -n "${INPUT_NEXUS_USER}" ] && \
          [ -n "${INPUT_AUTH_TOKEN}" ]; then
          echo "::notice::Ignoring nexus_user: it applies to Basic" \
            "auth, and this publish uses token authentication," \
            "which carries no username."
        fi
        # load_credential needs both companion inputs; check
        # empty/non-empty alone and never echo the values (secrets)
        if [ "${INPUT_DRY_RUN}" != "true" ] && \
          [ "${INPUT_LOAD_CREDENTIAL}" = "true" ]; then
          if [ -z "${INPUT_VAULT_MAPPING_JSON}" ]; then
            echo "Error: load_credential is 'true' but" \
              "vault_mapping_json is empty ❌"
            echo "Provide vault_mapping_json alongside"
            echo "load_credential"
            exit 1
          fi
          if [ -z "${INPUT_OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "Error: load_credential is 'true' but" \
              "op_service_account_token is empty ❌"
            echo "Provide op_service_account_token alongside"
            echo "load_credential"
            exit 1
          fi
        fi
        # Restrict the Node.js version specifier to a safe character
        # set; the value flows into the setup-node action input
        if [ -n "${INPUT_NODE_VERSION}" ]; then
          case "${INPUT_NODE_VERSION}" in
            *[!A-Za-z0-9./*_-]*)
              echo "Error: invalid node_version ❌"
              echo "Allowed characters: A-Z a-z 0-9 . * / _ -"
              exit 1 ;;
          esac
        fi
        # The version file takes precedence over node_version; check
        # its character set, then confirm it resolves to a file within
        # the workspace
        node_version="${INPUT_NODE_VERSION}"
        node_version_file=""
        if [ -n "${INPUT_NODE_VERSION_FILE}" ]; then
          case "${INPUT_NODE_VERSION_FILE}" in
            *[!A-Za-z0-9./_-]*)
              echo "Error: invalid node_version_file ❌"
              echo "Allowed characters: A-Z a-z 0-9 . / _ -"
              exit 1 ;;
          esac
          case "${INPUT_NODE_VERSION_FILE}" in
            /*) version_file="${INPUT_NODE_VERSION_FILE}" ;;
            *)
              version_file="${GITHUB_WORKSPACE}/"
              version_file="${version_file}${INPUT_NODE_VERSION_FILE}"
              ;;
          esac
          if [ ! -f "${version_file}" ]; then
            echo "Error: node_version_file not found ❌"
            exit 1
          fi
          # Fail closed: an empty result from a failed realpath
          # would degrade the case pattern below to /* and accept
          # any path
          if ! resolved="$(realpath -- "${version_file}")" || \
            [ -z "${resolved}" ]; then
            echo "Error: cannot resolve node_version_file ❌"
            exit 1
          fi
          if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
            [ -z "${workspace}" ]; then
            echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
            exit 1
          fi
          case "${resolved}/" in
            "${workspace}/"*) ;;
            *)
              echo "Error: node_version_file escapes the workspace ❌"
              exit 1 ;;
          esac
          node_version=""
          node_version_file="${INPUT_NODE_VERSION_FILE}"
        fi
        if [ -z "${node_version}" ] && [ -z "${node_version_file}" ]; then
          echo "Error: no Node.js version specified ❌"
          echo "Provide node_version or node_version_file"
          exit 1
        fi
        # Anchor relative paths to GITHUB_WORKSPACE: composite
        # actions can run with a caller-set working directory, so
        # resolving against the current directory would be
        # non-deterministic
        case "${INPUT_PATH_PREFIX}" in
          /*) project_dir="${INPUT_PATH_PREFIX}" ;;
          *) project_dir="${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}" ;;
        esac
        if [ ! -d "${project_dir}" ]; then
          echo "Error: invalid project directory ❌"
          # Strip CR/LF before logging the untrusted path: embedded
          # newlines could otherwise inject workflow commands via the
          # log stream
          printf 'Path not found: %s\n' \
            "$(printf '%s' "${project_dir}" | tr -d '\r\n')"
          exit 1
        fi
        # Restrict publishing to the workspace: an absolute or
        # escaped path could otherwise pack and publish arbitrary
        # runner filesystem content. Fail closed on realpath failure:
        # an empty result would degrade the case pattern below to /*
        # and accept any path
        if ! resolved="$(realpath -- "${project_dir}")" || \
          [ -z "${resolved}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
          [ -z "${workspace}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${resolved}/" in
          "${workspace}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        if [ ! -f "${resolved}/package.json" ]; then
          echo "Error: no package.json in project directory ❌"
          exit 1
        fi
        # tarball_path publishes bytes that already exist rather than
        # packing the project again. It is validated here, against the
        # same workspace boundary as path_prefix: the value becomes an
        # 'npm publish' argument, so an escaping path would publish
        # arbitrary runner content.
        tarball=''
        if [ -n "${INPUT_TARBALL_PATH}" ]; then
          # Check the raw input for line breaks before resolving it.
          # Command substitution strips trailing newlines, so a value
          # ending in one would resolve to the newline-free sibling
          # path and validate a different file from the one named --
          # silently, and past the resolved-path check below.
          case "${INPUT_TARBALL_PATH}" in
            *$'\n'*|*$'\r'*)
              echo "Error: tarball_path contains a line break ❌"
              exit 1 ;;
          esac
          case "${INPUT_TARBALL_PATH}" in
            /*) tarball="${INPUT_TARBALL_PATH}" ;;
            *) tarball="${GITHUB_WORKSPACE}/${INPUT_TARBALL_PATH}" ;;
          esac
          # Resolve before testing the type, so a symlink is judged by
          # its target. Fail closed on realpath failure, as above.
          #
          # The sentinel keeps a newline that belongs to the filename.
          # Command substitution strips every trailing newline, so a
          # symlink whose target ends in one would otherwise resolve
          # to the newline-free sibling -- validating one file while
          # the caller named another, past the guard below. Appending
          # 'x' and removing it, then exactly one delimiter newline,
          # leaves any filename newline in place to be caught.
          if ! resolved_tarball="$(realpath -- "${tarball}" \
            && printf 'x')"; then
            echo "Error: cannot resolve tarball_path ❌"
            printf 'Path not found: %s\n' \
              "$(printf '%s' "${INPUT_TARBALL_PATH}" | tr -d '\r\n')"
            exit 1
          fi
          resolved_tarball="${resolved_tarball%x}"
          tarball="${resolved_tarball%$'\n'}"
          if [ -z "${tarball}" ]; then
            echo "Error: cannot resolve tarball_path ❌"
            exit 1
          fi
          case "${tarball}" in
            "${workspace}/"*) ;;
            *)
              echo "Error: tarball escapes the workspace ❌"
              echo "tarball_path must resolve within GITHUB_WORKSPACE"
              exit 1 ;;
          esac
          # The resolved path is written to $GITHUB_OUTPUT as a plain
          # key=value, so a line break in it would forge a second
          # output. The raw input is already clear of them, but a
          # symlink can resolve to a target that is not.
          case "${tarball}" in
            *$'\n'*|*$'\r'*)
              echo "Error: resolved tarball path contains a line" \
                "break ❌"
              exit 1 ;;
          esac
          # -f follows symlinks and excludes directories, devices and
          # the dangling-link case in one test.
          if [ ! -f "${tarball}" ]; then
            echo "Error: tarball_path is not a file ❌"
            printf 'Path: %s\n' \
              "$(printf '%s' "${tarball}" | tr -d '\r\n')"
            exit 1
          fi
          case "${tarball}" in
            *.tgz) ;;
            *)
              echo "Error: tarball_path must name a .tgz file ❌"
              echo "npm pack produces .tgz; npm publish rejects other"
              echo "extensions after the credential setup has run"
              exit 1 ;;
          esac
          # The tarball carries its own version, and the stamp step is
          # skipped, so publish_version no longer decides what ships.
          # Compare the two rather than letting the input become
          # decorative: a stale artefact would otherwise publish under
          # a version the caller never asked for, and the verify step
          # would then look up the wrong one.
          # Read the manifest and parse it as two steps. As a single
          # 'tar | jq' pipeline the exit status is jq's, and jq
          # succeeds on the empty input a failed tar leaves behind --
          # so a corrupt archive would fall through to the "declares
          # no version" branch below and report the wrong cause.
          # Splitting them also means this does not depend on the
          # caller's pipefail setting to be correct.
          # Copy the archive out of the workspace *before* reading it,
          # and validate the copy.
          #
          # Every check below opens the archive, and so does npm publish
          # later. On the workspace path each open is a fresh chance to
          # substitute the file, and no digest taken around a read can
          # close that: a swap during the read and a swap back before the
          # hash makes both hashes agree while the manifest came from the
          # other archive. Copying first removes the race rather than
          # narrowing it -- the bytes validated are the bytes published,
          # because they are the same file.
          #
          # RUNNER_TEMP sits outside the checked-out tree, so repository
          # content cannot reach it.
          staging="$(mktemp -d "${RUNNER_TEMP:?}/npmstage.XXXXXX")"
          # Remove it again if this step does not reach the end. The
          # final always() step keys off the tarball output, which is
          # written only on success, so a failure between here and there
          # would otherwise leave the directory on a runner that keeps
          # RUNNER_TEMP. Cleared after the outputs are written, so the
          # successful path hands the directory to that step instead.
          trap 'rm -rf -- "${staging}"' EXIT
          staged="${staging}/package.tgz"
          # -P copies a symlink as a symlink instead of following it. The
          # boundary check above resolved the path, but the file at that
          # path is still repository content and can be replaced between
          # the check and this open -- by a symlink pointing outside the
          # workspace, which a following cp would silently read. With -P
          # the swap yields a symlink in the staging directory, which the
          # test below refuses. The bytes staged are therefore either the
          # regular file that was there, or nothing.
          if ! cp -P -- "${tarball}" "${staged}"; then
            echo "Error: cannot stage the tarball ❌"
            exit 1
          fi
          if [ -L "${staged}" ] || [ ! -f "${staged}" ]; then
            echo "Error: the tarball was replaced while being staged ❌"
            exit 1
          fi
          tarball="${staged}"

          if ! tarball_manifest="$(tar -xzOf "${tarball}" \
            package/package.json 2>/dev/null)"; then
            echo "Error: cannot read package.json from the tarball ❌"
            echo "Expected an npm pack archive containing package/"
            exit 1
          fi
          if ! tarball_version="$(printf '%s' "${tarball_manifest}" \
            | jq -r '.version // empty' 2>/dev/null)"; then
            echo "Error: package.json in the tarball is not valid" \
              "JSON ❌"
            exit 1
          fi
          if [ -z "${tarball_version}" ]; then
            echo "Error: tarball package.json declares no version ❌"
            exit 1
          fi
          if [ "${tarball_version}" != "${INPUT_PUBLISH_VERSION}" ]; then
            echo "Error: tarball version does not match" \
              "publish_version ❌"
            printf 'tarball:        %s\n' \
              "$(printf '%s' "${tarball_version}" | tr -d '\r\n')"
            printf 'publish_version: %s\n' \
              "$(printf '%s' "${INPUT_PUBLISH_VERSION}" | tr -d '\r\n')"
            echo "Pack the tarball at the version being published"
            exit 1
          fi
          echo "Publishing pre-packed tarball at ${tarball_version} ✅"
        fi
        # Both values passed the character allowlists above, so the
        # plain output format is safe here
        echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"
        echo "node_version_file=${node_version_file}" >> "$GITHUB_OUTPUT"
        # Empty when packing the project directory. Re-emitted resolved
        # rather than as given, so the publish step consumes the path
        # this step actually checked.
        echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
        # Only now hand the staged directory to the cleanup step. That
        # step keys off the tarball output, so clearing the trap before
        # this write would strand the archive if the write itself failed.
        trap - EXIT

    - name: "Setup Node.js"
      # yamllint disable-line rule:line-length
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.validate.outputs.node_version }}
        node-version-file: ${{ steps.validate.outputs.node_version_file }}

    # Dry-run mode performs no publish and sets up no credential, so
    # it skips the credential machinery entirely. For real publishes
    # the npmrc action writes the authenticated .npmrc and registers
    # a guaranteed post-job step that scrubs it again
    - name: "Resolve the effective registry"
      id: registry
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        REGISTRY_URL: ${{ inputs.registry_url }}
        # The validated tarball, when publishing a pre-packed archive.
        # npm resolves the publish from the manifest inside it, so its
        # scope and publishConfig decide the registry -- not the
        # working directory's.
        TARBALL: ${{ steps.validate.outputs.tarball }}
      run: |
        # Resolve the effective registry
        # Anchor relative paths to GITHUB_WORKSPACE and re-enforce the
        # workspace boundary at the point of use (TOCTOU), as the
        # stamp, publish and verify steps do. This step reads a
        # package.json and npm configuration from the directory, so a
        # swapped symlink would resolve the registry from a project
        # outside the workspace. Fail closed on realpath failure: an
        # empty result would degrade the case pattern below to /* and
        # accept any path
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        # The tarball needs no boundary check here: validate staged the
        # validated bytes into RUNNER_TEMP, outside the checked-out
        # tree, so this is not a path repository content can reach.
        # Confirmed to be under RUNNER_TEMP rather than trusted, since
        # the value still crossed a step boundary.
        if [ -n "${TARBALL}" ]; then
          case "${TARBALL}" in
            "${RUNNER_TEMP:?}"/*) ;;
            *)
              echo "Error: the tarball is not the staged copy ❌"
              exit 1 ;;
          esac
          if [ ! -f "${TARBALL}" ]; then
            echo "Error: the staged tarball is missing ❌"
            exit 1
          fi
        fi
        # This is the first bundled program the action runs, so the
        # runtime check that used to guard the publish step belongs
        # here now. A node_version too old to load the bundle would
        # otherwise surface as a raw syntax or module error, instead of
        # naming the input that needs raising -- and it would do so
        # before the publish rather than after, which is the one mercy
        # of the original placement.
        if ! node \
          "${GITHUB_ACTION_PATH}/dist/resolve-registry/index.js" \
          --selftest; then
          echo "::error::The selected Node.js cannot run this action's" \
            "bundled programs. Raise node_version, or the version in" \
            "the file named by node_version_file, to a release this" \
            "action supports."
          exit 1
        fi
        PROJECT_DIR="${PROJECT_DIR}" TARBALL="${TARBALL}" \
          node "${GITHUB_ACTION_PATH}/dist/resolve-registry/index.js"

    - name: "Create authenticated .npmrc"
      if: inputs.dry_run != 'true'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/node-create-npmrc-action@e0ff8adfc0591c86d8d07828bffab10f43096155 # v0.2.0
      with:
        # The resolved registry, not the raw input. This action writes a
        # credential keyed to the registry URL, and it replaces the
        # project's .npmrc rather than merging with it -- so keying it to
        # registry_url while npm publishes somewhere a publishConfig
        # override selected leaves that destination with no credential,
        # and the publish fails with a 401.
        #
        # Resolution runs before this step for the same reason: the
        # project's own .npmrc is one of the sources it reads, and this
        # step overwrites it.
        registry_url: ${{ steps.registry.outputs.registry }}
        nexus_user: ${{ inputs.nexus_user }}
        nexus_password: ${{ inputs.nexus_password }}
        auth_token: ${{ inputs.auth_token }}
        load_credential: ${{ inputs.load_credential }}
        vault_mapping_json: ${{ inputs.vault_mapping_json }}
        op_service_account_token: ${{ inputs.op_service_account_token }}
        scope: ${{ inputs.scope }}
        path: ${{ inputs.path_prefix }}

    # Placed before the .npmrc step, which replaces the project's own
    # file rather than merging with it -- so resolving afterwards would
    # read the credential file this action just wrote instead of the
    # configuration the project ships, and miss a scoped registry set
    # there. The resolved value is then fed to that step, so the
    # credential is keyed to the registry npm will actually use.
    #
    # A scoped package can redirect its own publish, and until now the
    # action reported and verified against registry_url regardless -- so
    # a successful publish could be "verified" against a registry it
    # never reached.

    - name: "Stamp version into package.json"
      id: stamp
      # A pre-packed tarball already carries its version, verified
      # against publish_version in the validate step, and its bytes are
      # what publishes. Stamping the working tree would change a
      # manifest nothing reads, and rewriting the tarball is the whole
      # divergence this input exists to remove.
      if: inputs.tarball_path == ''
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PUBLISH_VERSION: ${{ inputs.publish_version }}
      run: |
        # Stamp version into package.json
        # setup-node provides node/npm; confirm before use in case a
        # caller-side setup problem left the tools unavailable
        for tool in node npm; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            exit 1
          fi
        done
        # Anchor relative paths to GITHUB_WORKSPACE so behaviour stays
        # deterministic when the caller sets a working directory. The
        # :? expansions hard-fail on unset/empty runner variables,
        # which would otherwise weaken the boundary checks below
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        # Re-resolve and enforce the workspace boundary at the point
        # of use: the workspace is mutable between steps, so relying
        # solely on the earlier validate step would leave a TOCTOU
        # gap (a validated directory swapped for an escaping
        # symlink). Fail closed on realpath failure: an empty result
        # would degrade the case pattern below to /* and accept any
        # path
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        cd "${PROJECT_DIR}" || exit 1
        # Surface suppressed lifecycle hooks before stamping. The
        # --ignore-scripts below means anything they would have done
        # (writing the version into a source constant, updating a
        # changelog) does not happen, so the published package keeps
        # its pre-stamp content. That is silent otherwise.
        hooks="$(jq -r '[(.scripts // {}) | keys[]
          | select(. == "preversion" or . == "version"
                   or . == "postversion")] | join(", ")' \
          package.json)"
        if [ -n "${hooks}" ]; then
          echo "::notice::Skipped npm version lifecycle script(s):" \
            "${hooks}. Release lanes stamp without installing" \
            "dependencies, so these do not run; anything they write" \
            "into the package is absent from the published artefact."
        fi
        # Versions get stamped at publish time in the Linux
        # Foundation merge-driven model, so the committed
        # package.json version is not the source of truth;
        # --allow-same-version keeps re-stamping idempotent.
        #
        # --ignore-scripts because no release lane installs
        # dependencies before stamping, so a preversion/version hook
        # invoking the test or build script cannot succeed. Both
        # lanes suppress them, so the two produce the same tree.
        #
        # --no-workspaces because 'npm version' is workspace aware
        # too, and runs before the publish. With workspaces enabled
        # in configuration it stamps every workspace package and
        # leaves this one alone -- rewriting sibling manifests that
        # were never part of this publish.
        #
        # A workspace *selector* in an .npmrc conflicts with the flag
        # rather than being overridden by it, and npm reports that
        # nothing here can detect in advance: the selection appears
        # in neither 'npm config get workspace' nor 'npm config
        # list'. Failing at the stamp is the safe side -- nothing has
        # published yet -- so keep npm's message and add the remedy.
        set +e
        stamp_out="$(npm version "${PUBLISH_VERSION}" \
          --no-git-tag-version --allow-same-version \
          --ignore-scripts --no-workspaces 2>&1)"
        stamp_rc=$?
        set -e
        if [ "${stamp_rc}" != "0" ]; then
          printf '%s\n' "${stamp_out}"
          case "${stamp_out}" in
            *'--no-workspaces and --workspace'*)
              echo "Error: a workspace is selected in npm" \
                "configuration ❌"
              echo "This action publishes one package, so it stamps"
              echo "and publishes with workspaces disabled. Remove"
              echo "the workspace setting and point path_prefix at"
              echo "the package instead." ;;
          esac
          exit 1
        fi
        stamped="$(jq -r '.version // empty' package.json)"
        if [ "${stamped}" != "${PUBLISH_VERSION}" ]; then
          echo "Error: version stamp verification failed ❌"
          printf 'package.json version: %s\n' \
            "$(printf '%s' "${stamped}" | tr -d '\r\n')"
          exit 1
        fi
        echo "Stamped version ${PUBLISH_VERSION} into package.json ✅"

    - name: "Publish package"
      id: publish
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PUBLISH_VERSION: ${{ inputs.publish_version }}
        DRY_RUN: ${{ inputs.dry_run }}
        TAG: ${{ inputs.tag }}
        ACCESS: ${{ inputs.access }}
        PROVENANCE: ${{ inputs.provenance }}
        TARBALL: ${{ steps.validate.outputs.tarball }}
        REGISTRY_URL: ${{ steps.registry.outputs.registry }}
        # Pins every consulted scope at publish time; see the run body.
        # yamllint disable-line rule:line-length
        REGISTRY_SCOPES: ${{ steps.registry.outputs.registry_scopes }}
      run: |
        # Publish package
        # Anchor relative paths to GITHUB_WORKSPACE and re-enforce
        # the workspace boundary at the point of use (TOCTOU). Fail
        # closed on realpath failure: an empty result would degrade
        # the case pattern below to /* and accept any path
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        # Scratch directory for the publish metadata; removed on step
        # exit because RUNNER_TEMP is not always cleaned between runs
        # on self-hosted runners
        scratch_dir="$(mktemp -d "${RUNNER_TEMP:?}/npmpublish.XXXXXX")"
        trap 'rm -rf -- "${scratch_dir}"' EXIT

        # Build the publish arguments from validated inputs; every
        # value passed a whole-string allowlist in the validate step
        set -- publish --json --tag "${TAG}"
        # A pre-packed tarball publishes as a positional argument, and
        # npm accepts it only immediately after the subcommand, so it
        # is spliced in before the flags rather than appended. npm then
        # skips packing entirely, which is the point: the bytes that
        # were attested are the bytes the registry receives.
        #
        # The path is absolute and workspace-checked, so the cd below
        # still applies for credential resolution without affecting
        # which file publishes.
        if [ -n "${TARBALL}" ]; then
          # npm opens this path itself, so no check here can be atomic
          # with that open. The archive is therefore the staged copy in
          # RUNNER_TEMP rather than the workspace path: validate put the
          # validated bytes somewhere repository content cannot reach,
          # which is what makes the version, identity and registry this
          # publish relies on the ones that were checked.
          case "${TARBALL}" in
            "${RUNNER_TEMP:?}"/*) ;;
            *)
              echo "Error: the tarball is not the staged copy ❌"
              exit 1 ;;
          esac
          if [ ! -f "${TARBALL}" ]; then
            echo "Error: the staged tarball is missing ❌"
            exit 1
          fi
          set -- publish "${TARBALL}" --json --tag "${TAG}"
        fi
        # This action publishes the single package at path_prefix.
        # With workspaces enabled through configuration, npm would
        # fan out and emit one metadata entry per package, while the
        # parse below takes a single object -- so several packages
        # would publish and only one would be verified and reported.
        #
        # Unconditional: validate rejects an npm_config_workspace
        # selection, which is the only source npm refuses alongside
        # this flag, so the two cannot conflict.
        set -- "$@" --no-workspaces
        if [ -n "${ACCESS}" ]; then
          set -- "$@" --access "${ACCESS}"
        fi
        if [ "${PROVENANCE}" = "true" ]; then
          set -- "$@" --provenance
        fi
        # --registry applies to a dry run as well. npm still queries the
        # selected registry for existing metadata, so omitting it sent
        # the lookup to npm's default while the summary named the
        # resolved one -- reporting a registry the run never touched.
        if [ -n "${REGISTRY_URL}" ]; then
          set -- "$@" --registry "${REGISTRY_URL}"
          # Pin the scoped key too, which makes the resolved value
          # authoritative rather than a prediction.
          #
          # npm re-reads the manifest and flattens publishConfig again
          # after prepublishOnly has run, so for a directory publish a
          # script can add publishConfig["@scope:registry"] and redirect
          # the publish *after* this was resolved -- leaving the summary
          # and the verification on a registry nothing used. npm filters
          # any publishConfig key already supplied on the command line,
          # so supplying this one closes that window: verified against
          # npm 11.19.0, where --@scope:registry beat the manifest.
          #
          # This does not override the project's intent. The value being
          # pinned is the one resolved from the project's own manifest
          # and configuration; pinning only stops it moving afterwards.
          # Read line by line, not word by word: a scope may contain
          # whitespace and npm honours it. A herestring rather than a
          # pipe, because a pipe would run the loop in a subshell and
          # the arguments would not survive it.
          while IFS= read -r scope; do
            [ -n "${scope}" ] || continue
            set -- "$@" "--${scope}:registry=${REGISTRY_URL}"
          done <<< "${REGISTRY_SCOPES}"
        fi
        if [ "${DRY_RUN}" = "true" ]; then
          set -- "$@" --dry-run
          echo "Publishing in dry-run mode (packs and reports only;" \
            "npm performs no publish)"
        fi

        cd "${PROJECT_DIR}" || exit 1

        # Warn when a directory publish defines a hook that can rewrite
        # the manifest npm rereads.
        #
        # The pins above fix the registry for every scope known now. A
        # prepack, prepare or prepublishOnly script runs inside npm
        # publish and can introduce a scope that did not exist when the
        # pins were built -- by renaming the package, or by setting
        # publishConfig.scope alongside a matching @scope:registry key
        # -- which npm then consults ahead of them.
        #
        # Checked before publishing rather than after. The post-publish
        # manifest cannot answer this: postpublish may restore a name
        # prepublishOnly changed, hiding it, or change one itself,
        # inventing a mismatch that never reached the registry. npm own
        # JSON reports the manifest it read *before* those hooks ran.
        # So this reports what is knowable -- that the risk exists --
        # and how to remove it.
        #
        # A notice, not a failure: these hooks are ordinary and most do
        # not touch the name.
        if [ -z "${TARBALL}" ] && [ -f package.json ]; then
          hooks="$(jq -r '[(.scripts // {}) | keys[]
            | select(. == "prepack" or . == "prepare"
                     or . == "prepublishOnly")] | join(", ")' \
            package.json)"
          if [ -n "${hooks}" ]; then
            echo "::notice::This publish runs lifecycle script(s):" \
              "${hooks}. They execute inside npm publish, after the" \
              "registry was resolved, so one that changes the package" \
              "name or publishConfig.scope can select a scoped registry" \
              "these pins do not cover -- leaving the summary and" \
              "verification describing another destination. Pack first" \
              "and publish through" \
              "tarball_path to remove the possibility; a tarball" \
              "publish runs no lifecycle scripts."
          fi
        fi

        # The parser below runs on the Node.js that node_version or
        # node_version_file selected, which can sit below what the
        # bundle targets. Starting it there would fail *after* npm had
        # published -- the exact unsafe failure the parser exists to
        # prevent -- so prove it runs first. Before the publish this
        # costs nothing.
        if ! node \
          "${GITHUB_ACTION_PATH}/dist/parse-publish-output/index.js" \
          --selftest; then
          echo "::error::The selected Node.js cannot run this action's" \
            "publish-output parser, which reads npm's result. Refusing" \
            "to publish, because the failure would otherwise land after" \
            "the package reached the registry. Raise node_version, or" \
            "the version in the file named by node_version_file, to a" \
            "release this action supports."
          exit 1
        fi

        set +e
        npm "$@" > "${scratch_dir}/publish.json"
        publish_exit=$?
        set -e

        # Interpreting npm's output is delegated to a small Node
        # program, because the captured stream is not reliably a JSON
        # document. npm runs lifecycle scripts with inherited stdio,
        # so prepublishOnly, publish and postpublish output lands in
        # the same file -- including unbalanced braces and JSON of
        # the hooks' own. Locating npm's object within that, in
        # either npm generation's shape, is beyond what a jq filter
        # can do safely, and it is unit tested rather than exercised
        # by extracting a fragment of this file.
        #
        # It also emits the outputs and the step summary, and
        # decides the failure message: npm's exit status is passed
        # in so that a package which reached the registry is never
        # reported as a bare failure, which would invite a retry
        # that cannot succeed.
        PUBLISH_OUTPUT_FILE="${scratch_dir}/publish.json" \
        PUBLISH_EXIT_CODE="${publish_exit}" \
          node "${GITHUB_ACTION_PATH}/dist/parse-publish-output/index.js"


    # Best-effort registry confirmation for real publishes: some
    # registries restrict anonymous reads or index asynchronously, so
    # an unreadable package downgrades to a warning; a readable
    # package with the wrong version fails the action
    - name: "Verify publication on registry"
      if: inputs.dry_run != 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
        PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
        REGISTRY_URL: ${{ steps.registry.outputs.registry }}
        # Every scope npm would consult. Needed because --registry does
        # not outrank a scoped setting.
        # yamllint disable-line rule:line-length
        REGISTRY_SCOPES: ${{ steps.registry.outputs.registry_scopes }}
      run: |
        # Verify publication on registry
        # Anchor relative paths to GITHUB_WORKSPACE and re-enforce
        # the workspace boundary at the point of use (TOCTOU). Fail
        # closed on realpath failure: an empty result would degrade
        # the case pattern below to /* and accept any path
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            exit 1 ;;
        esac
        # Re-validate values that crossed a step boundary before use
        case "${PACKAGE_NAME}" in
          *[!@A-Za-z0-9._/-]*|'')
            echo "Error: unusable package name for verification ❌"
            exit 1 ;;
        esac
        case "${PUBLISHED_VERSION}" in
          *[!0-9A-Za-z.-]*|'')
            echo "Error: unusable version for verification ❌"
            exit 1 ;;
        esac
        # Run from the project directory so the authenticated .npmrc
        # written by node-create-npmrc-action applies
        cd "${PROJECT_DIR}" || exit 1
        # --registry alone does not decide where this looks. npm's
        # pickRegistry prefers a scoped setting over it, so for a
        # scoped package a project @scope:registry would send this
        # query somewhere other than the registry the publish reached
        # -- checking the wrong host while appearing to honour the
        # resolved value. Setting the scoped key on the command line
        # puts the resolved registry where pickRegistry looks first.
        #
        # Authentication is unaffected: npm keys credentials by the
        # registry URL, and this forces the one the publish used.
        set -- "${PACKAGE_NAME}@${PUBLISHED_VERSION}" version \
          --registry "${REGISTRY_URL}"
        # Every consulted scope, not only the one that decided. npm view
        # does not load publishConfig, so a key the manifest masked is
        # live again here and would outrank both --registry and a pin on
        # the winning scope alone.
        while IFS= read -r scope; do
          [ -n "${scope}" ] || continue
          set -- "$@" "--${scope}:registry=${REGISTRY_URL}"
        done <<< "${REGISTRY_SCOPES}"
        set +e
        seen="$(npm view "$@" 2>/dev/null)"
        view_exit=$?
        set -e
        if [ "${view_exit}" != "0" ]; then
          echo "::warning::could not confirm" \
            "${PACKAGE_NAME}@${PUBLISHED_VERSION} on the registry" \
            "(anonymous reads may be restricted, or indexing" \
            "may lag)"
          exit 0
        fi
        if [ "${seen}" != "${PUBLISHED_VERSION}" ]; then
          echo "Error: registry reports an unexpected version ❌"
          printf 'Registry reported: %s\n' \
            "$(printf '%s' "${seen}" | tr -d '\r\n')"
          echo "Expected: ${PUBLISHED_VERSION}"
          exit 1
        fi
        echo "Registry confirmed" \
          "${PACKAGE_NAME}@${PUBLISHED_VERSION} ✅"
        echo "Registry confirmed" \
          "${PACKAGE_NAME}@${PUBLISHED_VERSION} ✅" \
          >> "$GITHUB_STEP_SUMMARY"

    # The staged archive has to outlive the step that made it, because
    # the registry resolution and the publish both read it -- so it
    # cannot use the EXIT trap pattern the publish scratch directory
    # does. It is removed here instead.
    #
    # always(), because a failed publish leaves the archive behind just
    # as a successful one does, and RUNNER_TEMP is not guaranteed to be
    # cleaned between runs on a self-hosted runner. A complete package
    # archive per publish would accumulate there indefinitely.
    - name: "Remove the staged tarball"
      if: always() && steps.validate.outputs.tarball != ''
      shell: bash
      env:
        STAGED: ${{ steps.validate.outputs.tarball }}
      run: |
        # Remove the staged tarball
        # Refuse to delete anything that is not this action's own
        # staging directory. The value crossed a step boundary, and a
        # recursive delete driven by an unchecked path is worth being
        # paranoid about even when the source is trusted.
        case "${STAGED}" in
          "${RUNNER_TEMP:?}"/npmstage.*/package.tgz) ;;
          *)
            echo "::warning::Not removing ${STAGED}: it is not a staged" \
              "tarball path"
            exit 0 ;;
        esac
        # The case above fixed the shape, so the parent is everything
        # before the last '/'. Parameter expansion rather than dirname,
        # to avoid adding another tool to the preflight contract for a
        # step that runs after a successful publish.
        rm -rf -- "${STAGED%/*}"
