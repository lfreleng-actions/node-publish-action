---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it runs the local action against
  # third-party fixture repositories, letting that untrusted code
  # poison caches later runs restore (CWE-349). The fixtures stay
  # pinned to explicit commit SHAs, which is what bounds the same
  # exposure on the push trigger below.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test dry-run publishing against both fixtures ###
  # CI has no registry credentials, so every test runs in dry-run
  # mode; real publishes exercise the same stamp/publish/verify path
  # with the credential steps enabled
  test-dry-run:
    name: "Test: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Node fixture (test-node-project)"
            repository: "lfreleng-actions/test-node-project"
            ref: "89cc7f156c88afa1855087b00ac0dce886e7b0f3"
            publish_version: "9.9.9"
            expected_name: "test-node-project"
            expected_tarball: "test-node-project-9.9.9.tgz"
          - name: "Real fixture (onap/sdc-onap-ui-common)"
            repository: "onap/sdc-onap-ui-common"
            ref: "c305ee4240e368dd0b2238a4f39881a97bad6746"
            publish_version: "1.0.99-SNAPSHOT"
            expected_name: "onap-ui-common"
            expected_tarball: "onap-ui-common-1.0.99-SNAPSHOT.tgz"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The real fixture has no engines field and no .nvmrc, so the
      # matrix passes an explicit Node.js version for both fixtures
      - name: "Checkout test project: ${{ matrix.repository }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: test-project
          persist-credentials: false

      - name: "Running local action: dry-run publish"
        id: publish
        uses: ./
        with:
          path_prefix: test-project
          node_version: '22'
          publish_version: ${{ matrix.publish_version }}
          dry_run: 'true'

      - name: "Verify dry-run outputs and version stamp"
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
          TARBALL_NAME: ${{ steps.publish.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ matrix.publish_version }}
          EXPECTED_NAME: ${{ matrix.expected_name }}
          EXPECTED_TARBALL: ${{ matrix.expected_tarball }}
        run: |
          # Verify dry-run outputs and version stamp
          errors=0
          if [ "${PUBLISHED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Unexpected published_version ❌"
            echo "Output: ${PUBLISHED_VERSION}"
            echo "Expected: ${EXPECTED_VERSION}"
            errors=1
          fi
          if [ "${PACKAGE_NAME}" != "${EXPECTED_NAME}" ]; then
            echo "Unexpected package_name ❌"
            echo "Output: ${PACKAGE_NAME}"
            echo "Expected: ${EXPECTED_NAME}"
            errors=1
          fi
          if [ "${TARBALL_NAME}" != "${EXPECTED_TARBALL}" ]; then
            echo "Unexpected tarball_name ❌"
            echo "Output: ${TARBALL_NAME}"
            echo "Expected: ${EXPECTED_TARBALL}"
            errors=1
          fi
          # The action must stamp the version into package.json
          stamped="$(jq -r '.version // empty' \
            test-project/package.json)"
          if [ "${stamped}" != "${EXPECTED_VERSION}" ]; then
            echo "Version stamp not applied ❌"
            echo "package.json version: ${stamped}"
            echo "Expected: ${EXPECTED_VERSION}"
            errors=1
          fi
          # Dry-run mode must skip the credential machinery, so no
          # .npmrc may appear in the project directory
          if [ -f test-project/.npmrc ]; then
            echo "Dry run wrote an .npmrc ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Dry-run tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Dry-run publish verified ✅"
          {
            echo "Dry-run publish verified ✅"
            echo "Package: ${PACKAGE_NAME}@${PUBLISHED_VERSION}"
            echo "Tarball: ${TARBALL_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test invalid inputs fail closed ###
  test-failures:
    name: "Test: invalid inputs and error handling"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A minimal project isolates each negative test on its target
      # input; the placeholder password below is a test literal, not
      # a real credential
      - name: "Create minimal project fixture"
        shell: bash
        run: |
          # Create minimal project fixture
          mkdir -p fake-project
          printf '%s\n' \
            '{"name": "fake-project", "version": "1.0.0"}' \
            > fake-project/package.json

      - name: "Running local action with shell metacharacters"
        id: bad-version
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: '1.0.0;rm -rf /'
          dry_run: 'true'

      - name: "Running local action with newline injection"
        id: newline-version
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: |
            1.0.0
            9.9.9-injected
          dry_run: 'true'

      - name: "Running local action with invalid registry URL"
        id: bad-registry
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          registry_url: 'https://nexus3.example.org/repository/npm'
          nexus_password: 'placeholder-not-a-secret'

      - name: "Running local action without credentials"
        id: no-credentials
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          registry_url: 'https://nexus3.example.org/repository/npm/'

      - name: "Running local action with workspace-escaping path"
        id: escape-path
        continue-on-error: true
        uses: ./
        with:
          path_prefix: /etc
          publish_version: '1.0.0'
          dry_run: 'true'

      - name: "Running local action with invalid tag"
        id: bad-tag
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          tag: 'not a tag'
          dry_run: 'true'

      - name: "Running local action with invalid access"
        id: bad-access
        continue-on-error: true
        uses: ./
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          access: internal
          dry_run: 'true'

      - name: "Verify invalid inputs were rejected"
        shell: bash
        env:
          VERSION_OUTCOME: ${{ steps.bad-version.outcome }}
          NEWLINE_OUTCOME: ${{ steps.newline-version.outcome }}
          REGISTRY_OUTCOME: ${{ steps.bad-registry.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.no-credentials.outcome }}
          ESCAPE_OUTCOME: ${{ steps.escape-path.outcome }}
          TAG_OUTCOME: ${{ steps.bad-tag.outcome }}
          ACCESS_OUTCOME: ${{ steps.bad-access.outcome }}
        run: |
          # Failure testing is also important; all steps MUST fail
          errors=0
          for outcome_pair in \
            "version:${VERSION_OUTCOME}" \
            "newline:${NEWLINE_OUTCOME}" \
            "registry:${REGISTRY_OUTCOME}" \
            "credentials:${CREDENTIALS_OUTCOME}" \
            "escape:${ESCAPE_OUTCOME}" \
            "tag:${TAG_OUTCOME}" \
            "access:${ACCESS_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" = "success" ]; then
              echo "Invalid ${test_name} unexpectedly succeeded ❌"
              errors=1
            fi
          done
          # The rejected inputs must leave package.json untouched
          stamped="$(jq -r '.version // empty' \
            fake-project/package.json)"
          if [ "${stamped}" != "1.0.0" ]; then
            echo "Rejected input still stamped a version ❌"
            echo "package.json version: ${stamped}"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Failure-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid inputs correctly rejected ✅"
          echo "Invalid inputs correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test version lifecycle scripts stay suppressed ###
  test-lifecycle-hooks:
    name: "Test: version lifecycle scripts do not run"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each hook writes a marker file. Their absence after the run
      # proves --ignore-scripts suppressed them, rather than the hook
      # merely producing no visible output.
      - name: "Create project fixture with version lifecycle hooks"
        shell: bash
        run: |
          # Create project fixture with version lifecycle hooks
          mkdir -p hook-project
          cat > hook-project/package.json << 'FIXTURE'
          {
            "name": "hook-project",
            "version": "1.0.0",
            "scripts": {
              "preversion": "touch preversion.marker",
              "version": "touch version.marker",
              "postversion": "touch postversion.marker"
            }
          }
          FIXTURE
          jq -e . hook-project/package.json > /dev/null

      - name: "Run local action against the hook fixture"
        id: hooks
        uses: ./
        with:
          path_prefix: hook-project
          publish_version: '2.3.4'
          node_version: '22'
          dry_run: 'true'

      - name: "Verify hooks stayed suppressed and version stamped"
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ steps.hooks.outputs.published_version }}
        run: |
          # Verify hooks stayed suppressed and the version still stamped
          errors=0
          for hook in preversion version postversion; do
            if [ -f "hook-project/${hook}.marker" ]; then
              echo "Lifecycle script '${hook}' ran despite" \
                "--ignore-scripts ❌"
              errors=1
            fi
          done
          # Suppression must not cost the stamp itself
          stamped="$(jq -r '.version // empty' \
            hook-project/package.json)"
          if [ "${stamped}" != "2.3.4" ]; then
            echo "Version stamp not applied ❌"
            echo "package.json version: ${stamped}"
            errors=1
          fi
          if [ "${PUBLISHED_VERSION}" != "2.3.4" ]; then
            echo "Unexpected published_version ❌"
            echo "Output: ${PUBLISHED_VERSION}"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Lifecycle suppression tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Version lifecycle scripts correctly suppressed ✅"
          echo "Version lifecycle scripts correctly suppressed ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test the publish metadata shape normalisation ###
  # npm 10 put name/version/filename at the top level; npm 11 keys
  # the object by package name. The action normalises both, and the
  # discriminator has to be the *type* of .name rather than its
  # presence, because a package legitimately called 'name' produces
  # {"name": {...}} under npm 11.
  #
  # No fixture can cover that: a dry run for a package named 'name'
  # would query the real registry, where that name is taken. So the
  # expression is extracted from action.yaml and run over the shapes
  # directly -- extracted rather than restated, so a regression in
  # the shipped filter fails the test.
  test-publish-metadata:
    name: "Test: publish metadata normalisation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Exercise the metadata filter over both npm shapes"
        shell: bash
        run: |
          # Exercise the metadata filter over both npm shapes
          # shellcheck disable=SC2016  # a jq filter, not a shell var
          raw="$(grep -A1 -m1 '^        meta="\$(jq -c' action.yaml)"
          filter="${raw#*jq -c \'}"
          filter="${filter%\' \\}"
          # Fail loudly rather than silently testing nothing if the
          # expression is renamed or reindented
          if ! printf '%s' "${filter}" | grep -q 'to_entries'; then
            echo "Could not extract the metadata filter ❌"
            echo "Update the extraction in this job to match"
            exit 1
          fi
          errors=0
          check() {
            got="$(printf '%s' "$2" | jq -c "${filter}" 2>/dev/null \
              | jq -r '[(.name|tostring), (.version|tostring),
                        (.filename|tostring)] | join(" ")' \
              2>/dev/null)"
            if [ "${got}" != "$3" ]; then
              echo "$1: got '${got}', want '$3' ❌"
              errors=1
            fi
          }
          check 'npm10 flat' \
            '{"name":"pkg","version":"1.0.0","filename":"pkg.tgz"}' \
            'pkg 1.0.0 pkg.tgz'
          check 'npm11 keyed' \
            '{"pkg":{"name":"pkg","version":"1.0.0","filename":"pkg.tgz"}}' \
            'pkg 1.0.0 pkg.tgz'
          scoped_in='{"@onap/ui":{"name":"@onap/ui",'
          scoped_in="${scoped_in}"'"version":"2.0.0",'
          scoped_in="${scoped_in}"'"filename":"onap-ui-2.0.0.tgz"}}'
          check 'npm11 scoped key' "${scoped_in}" \
            '@onap/ui 2.0.0 onap-ui-2.0.0.tgz'
          named_in='{"name":{"name":"name","version":"3.0.0",'
          named_in="${named_in}"'"filename":"name-3.0.0.tgz"}}'
          check 'npm11 package literally named name' "${named_in}" \
            'name 3.0.0 name-3.0.0.tgz'
          check 'npm10 package literally named name' \
            '{"name":"name","version":"3.0.0","filename":"name-3.0.0.tgz"}' \
            'name 3.0.0 name-3.0.0.tgz'
          check 'empty object fails closed' '{}' 'null null null'
          if [ "${errors}" != "0" ]; then
            echo "Metadata normalisation tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Publish metadata normalisation correct ✅"
          echo "Publish metadata normalisation correct ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      # The fan-out guard sits beside the filter above and rejects a
      # multi-entry result. test-workspace-publish cannot reach it:
      # --no-workspaces stops npm producing more than one entry, so
      # deleting the guard on its own leaves that job green. It is a
      # backstop for the case where the flag is bypassed, which by
      # definition no end-to-end fixture can create -- so drive it
      # directly, over the shapes npm emits when it does fan out.
      - name: "Exercise the workspace fan-out guard"
        shell: bash
        run: |
          # Exercise the workspace fan-out guard
          guard="${RUNNER_TEMP}/fanout.sh"
          # shellcheck disable=SC2016  # a sed address, not a shell var
          sed -n '/^        entry_count="\$(jq -r/,/^        esac$/p' \
            action.yaml | sed 's/^        //' > "${guard}"
          # Fail loudly rather than silently testing nothing if the
          # block is renamed or reindented
          if ! grep -q 'entry_count' "${guard}"; then
            echo "Could not extract the fan-out guard ❌"
            echo "Update the extraction in this job to match"
            exit 1
          fi
          scratch_dir="${RUNNER_TEMP}/fanout"
          rm -rf "${scratch_dir}"
          mkdir -p "${scratch_dir}"
          export scratch_dir
          errors=0
          # $1 case, $2 want (reject|allow), $3 publish.json body
          check() {
            printf '%s' "$3" > "${scratch_dir}/publish.json"
            set +e
            bash "${guard}" > /dev/null 2>&1
            rc=$?
            set -e
            if [ "${rc}" != "0" ]; then
              got='reject'
            else
              got='allow'
            fi
            if [ "${got}" != "$2" ]; then
              echo "$1: guard returned ${got}, expected $2 ❌"
              errors=1
            fi
          }
          check 'npm10 flat single' allow \
            '{"name":"pkg","version":"1.0.0"}'
          check 'npm11 keyed single' allow '{"pkg":{"name":"pkg"}}'
          # A package literally named 'name' is a single publish, not
          # a fan-out; the type test has to hold here too
          check 'npm11 package named name' allow \
            '{"name":{"name":"name","version":"3.0.0"}}'
          check 'two packages' reject \
            '{"a":{"name":"a"},"b":{"name":"b"}}'
          check 'three packages' reject \
            '{"a":{},"b":{},"c":{}}'
          # An empty object is not fan-out. It falls through to the
          # metadata checks, which report the missing fields more
          # usefully than a count would.
          check 'empty object' allow '{}'
          if [ "${errors}" != "0" ]; then
            echo "Fan-out guard tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Fan-out guard rejects multi-package results ✅"
          echo "Fan-out guard rejects multi-package results ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test that stamping never touches sibling workspace packages ###
  # 'npm version' is workspace aware and runs before the publish, so
  # with workspaces enabled in configuration it stamps every
  # workspace package and leaves the target alone -- rewriting
  # manifests that were never part of this publish. The stamp step is
  # extracted from action.yaml and run against a workspace fixture.
  test-workspace-stamp:
    name: "Test: stamping ignores sibling workspace packages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js"
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: "Stamp a workspace root and check the siblings"
        shell: bash
        run: |
          # Stamp a workspace root and check the siblings
          stamp="${RUNNER_TEMP}/stamp.sh"
          python3 -c "import yaml,sys; \
            d=yaml.safe_load(open('action.yaml')); \
            m=[x for x in d['runs']['steps'] \
               if x.get('name') == \
               'Stamp version into package.json']; \
            sys.exit('stamp step not found') if not m \
            else sys.stdout.write(m[0]['run'])" > "${stamp}"
          if ! grep -q 'no-workspaces' "${stamp}"; then
            echo "Could not extract the stamp step ❌"
            echo "Update the extraction in this job to match"
            exit 1
          fi
          root="${RUNNER_TEMP}/wsstamp"
          rm -rf "${root}"
          mkdir -p "${root}/home" "${root}/proj/packages/a"
          errors=0
          # $1 case, $2 project .npmrc
          check() {
            printf '%s\n' '{"name": "ws-root", "version": "1.0.0",' \
              ' "private": true, "workspaces": ["packages/*"]}' \
              > "${root}/proj/package.json"
            printf '%s\n' \
              '{"name": "ws-child", "version": "1.0.0"}' \
              > "${root}/proj/packages/a/package.json"
            printf '%s\n' "$2" > "${root}/proj/.npmrc"
            set +e
            env \
              HOME="${root}/home" \
              GITHUB_WORKSPACE="${root}" \
              PROJECT_DIR='proj' \
              PUBLISH_VERSION='7.7.7' \
              bash "${stamp}" > /dev/null 2>&1
            rc=$?
            set -e
            target="$(jq -r '.version // empty' \
              "${root}/proj/package.json")"
            sibling="$(jq -r '.version // empty' \
              "${root}/proj/packages/a/package.json")"
            if [ "${rc}" != "0" ]; then
              echo "$1: stamp failed ❌"
              errors=1
            fi
            if [ "${target}" != "7.7.7" ]; then
              echo "$1: target not stamped (${target}) ❌"
              errors=1
            fi
            if [ "${sibling}" != "1.0.0" ]; then
              echo "$1: sibling was rewritten to ${sibling} ❌"
              errors=1
            fi
          }
          check 'workspace root, no npm config' ''
          check 'workspace root, workspaces=true' 'workspaces=true'
          # A workspace *selector* in an .npmrc conflicts with the
          # flag rather than being overridden by it, and nothing can
          # detect it beforehand. It must fail at the stamp -- before
          # anything publishes -- and say what to do about it.
          printf '%s\n' '{"name": "ws-root", "version": "1.0.0",' \
            ' "private": true, "workspaces": ["packages/*"]}' \
            > "${root}/proj/package.json"
          printf '%s\n' \
            '{"name": "ws-child", "version": "1.0.0"}' \
            > "${root}/proj/packages/a/package.json"
          printf '%s\n' 'workspace=packages/a' \
            > "${root}/proj/.npmrc"
          set +e
          sel_out="$(env \
            HOME="${root}/home" \
            GITHUB_WORKSPACE="${root}" \
            PROJECT_DIR='proj' \
            PUBLISH_VERSION='7.7.7' \
            bash "${stamp}" 2>&1)"
          sel_rc=$?
          set -e
          if [ "${sel_rc}" = "0" ]; then
            echo "workspace selector: stamp unexpectedly succeeded ❌"
            errors=1
          fi
          if ! printf '%s' "${sel_out}" \
            | grep -q 'workspace is selected in npm'; then
            echo "workspace selector: no actionable message ❌"
            errors=1
          fi
          sel_sibling="$(jq -r '.version // empty' \
            "${root}/proj/packages/a/package.json")"
          if [ "${sel_sibling}" != "1.0.0" ]; then
            echo "workspace selector: sibling was rewritten ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Workspace stamping tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Stamping confined to the target package ✅"
          echo "Stamping confined to the target package ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test that publishing never fans out across a workspace ###
  # test-workspace-stamp extracts the stamp step, so neither the
  # publish's own --no-workspaces nor the fan-out guard on its result
  # is exercised there. Run the whole action against a workspace
  # fixture instead, in dry-run mode, and assert it reports the
  # target package alone.
  #
  # Two workspace children, deliberately. With one, npm reports a
  # single entry either way and only the *name* differs; with two,
  # dropping the flag makes npm emit an entry per child. So the case
  # discriminates against both regressions independently: without the
  # flag the fan-out guard rejects two entries and the action fails,
  # and without the guard as well the reported package is a child
  # rather than the target.
  test-workspace-publish:
    name: "Test: publishing ignores sibling workspace packages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d # v0.2.1
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create a workspace fixture with two children"
        shell: bash
        run: |
          # Create a workspace fixture with two children
          mkdir -p ws-project/packages/a ws-project/packages/b
          # These names reach npm during the dry run, which queries
          # the registry for an existing version. Names anyone could
          # register would fail CI without a code change, so use ones
          # nobody is plausibly going to claim.
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-fixture",' \
            ' "version": "1.0.0", "workspaces": ["packages/*"]}' \
            > ws-project/package.json
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-child-a",' \
            ' "version": "1.0.0"}' \
            > ws-project/packages/a/package.json
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-child-b",' \
            ' "version": "1.0.0"}' \
            > ws-project/packages/b/package.json
          for manifest in ws-project/package.json \
            ws-project/packages/a/package.json \
            ws-project/packages/b/package.json; do
            jq -e . "${manifest}" > /dev/null
          done

      - name: "Dry-run publish from the workspace root"
        id: ws-publish
        uses: ./
        with:
          path_prefix: ws-project
          publish_version: '9.9.9'
          dry_run: 'true'

      # A workspace selected through the environment is the one
      # source npm refuses alongside --no-workspaces, so validation
      # rejects it rather than letting the stamp fail. Nothing else
      # covers that branch: the selector case in test-workspace-stamp
      # writes 'workspace=' to an .npmrc, which reaches npm through a
      # different route entirely.
      #
      # Set in upper case deliberately. npm matches the npm_config_
      # prefix case insensitively and callers naturally write
      # environment variables this way, so the check folds case
      # before comparing; a literal lower-case comparison would miss
      # the form people actually use.
      - name: "Workspace selected via environment [expected failure]"
        id: ws-env
        continue-on-error: true
        env:
          NPM_CONFIG_WORKSPACE: 'packages/a'
        uses: ./
        with:
          path_prefix: ws-project
          publish_version: '5.5.5'
          dry_run: 'true'

      - name: "Verify only the target package was published"
        shell: bash
        env:
          NAME: ${{ steps.ws-publish.outputs.package_name }}
          VERSION: ${{ steps.ws-publish.outputs.published_version }}
          WS_ENV: ${{ steps.ws-env.outcome }}
        run: |
          # Verify only the target package was published
          errors=0
          want='lfreleng-node-publish-action-ws-fixture'
          if [ "${NAME}" != "${want}" ]; then
            echo "Reported package was '${NAME}', expected" \
              "'${want}' ❌"
            errors=1
          fi
          if [ "${VERSION}" != "9.9.9" ]; then
            echo "Reported version was '${VERSION}', expected" \
              "9.9.9 ❌"
            errors=1
          fi
          # The stamp is workspace confined too, so the children must
          # still carry their own versions
          for child in a b; do
            child_version="$(jq -r '.version // empty' \
              "ws-project/packages/${child}/package.json")"
            if [ "${child_version}" != "1.0.0" ]; then
              echo "Child ${child} was rewritten to" \
                "${child_version} ❌"
              errors=1
            fi
          done
          # The environment selector must fail during validation,
          # before the stamp. Asserting the outcome alone would not
          # discriminate, so check the version never moved to the one
          # that case requested: a regression letting the run reach
          # the stamp would leave 5.5.5 behind.
          if [ "${WS_ENV}" != "failure" ]; then
            echo "NPM_CONFIG_WORKSPACE selection was accepted ❌"
            errors=1
          fi
          root_version="$(jq -r '.version // empty' \
            ws-project/package.json)"
          if [ "${root_version}" = "5.5.5" ]; then
            echo "Environment selector was caught after the stamp ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Workspace publish tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Publishing confined to the target package ✅"
          echo "Publishing confined to the target package ✅" \
            >> "$GITHUB_STEP_SUMMARY"
