---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it runs the local action against
  # third-party fixture repositories, letting that untrusted code
  # poison caches later runs restore (CWE-349). The fixtures stay
  # pinned to explicit commit SHAs, which is what bounds the same
  # exposure on the push trigger below.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test dry-run publishing against both fixtures ###
  # CI has no registry credentials, so every test runs in dry-run
  # mode; real publishes exercise the same stamp/publish/verify path
  # with the credential steps enabled
  test-dry-run:
    name: "Test: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Node fixture (test-node-project)"
            repository: "lfreleng-actions/test-node-project"
            ref: "89cc7f156c88afa1855087b00ac0dce886e7b0f3"
            publish_version: "9.9.9"
            expected_name: "test-node-project"
            expected_tarball: "test-node-project-9.9.9.tgz"
          - name: "Real fixture (onap/sdc-onap-ui-common)"
            repository: "onap/sdc-onap-ui-common"
            ref: "c305ee4240e368dd0b2238a4f39881a97bad6746"
            publish_version: "1.0.99-SNAPSHOT"
            expected_name: "onap-ui-common"
            expected_tarball: "onap-ui-common-1.0.99-SNAPSHOT.tgz"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The real fixture has no engines field and no .nvmrc, so the
      # matrix passes an explicit Node.js version for both fixtures
      - name: "Checkout test project: ${{ matrix.repository }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: test-project
          persist-credentials: false

      - name: "Running local action: dry-run publish"
        id: publish
        uses: $/
        with:
          path_prefix: test-project
          node_version: '22'
          publish_version: ${{ matrix.publish_version }}
          dry_run: 'true'

      - name: "Verify dry-run outputs and version stamp"
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
          TARBALL_NAME: ${{ steps.publish.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ matrix.publish_version }}
          EXPECTED_NAME: ${{ matrix.expected_name }}
          EXPECTED_TARBALL: ${{ matrix.expected_tarball }}
        run: |
          # Verify dry-run outputs and version stamp
          errors=0
          if [ "${PUBLISHED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Unexpected published_version ❌"
            echo "Output: ${PUBLISHED_VERSION}"
            echo "Expected: ${EXPECTED_VERSION}"
            errors=1
          fi
          if [ "${PACKAGE_NAME}" != "${EXPECTED_NAME}" ]; then
            echo "Unexpected package_name ❌"
            echo "Output: ${PACKAGE_NAME}"
            echo "Expected: ${EXPECTED_NAME}"
            errors=1
          fi
          if [ "${TARBALL_NAME}" != "${EXPECTED_TARBALL}" ]; then
            echo "Unexpected tarball_name ❌"
            echo "Output: ${TARBALL_NAME}"
            echo "Expected: ${EXPECTED_TARBALL}"
            errors=1
          fi
          # The action must stamp the version into package.json
          stamped="$(jq -r '.version // empty' \
            test-project/package.json)"
          if [ "${stamped}" != "${EXPECTED_VERSION}" ]; then
            echo "Version stamp not applied ❌"
            echo "package.json version: ${stamped}"
            echo "Expected: ${EXPECTED_VERSION}"
            errors=1
          fi
          # Dry-run mode must skip the credential machinery, so no
          # .npmrc may appear in the project directory
          if [ -f test-project/.npmrc ]; then
            echo "Dry run wrote an .npmrc ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Dry-run tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Dry-run publish verified ✅"
          {
            echo "Dry-run publish verified ✅"
            echo "Package: ${PACKAGE_NAME}@${PUBLISHED_VERSION}"
            echo "Tarball: ${TARBALL_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test invalid inputs fail closed ###
  test-failures:
    name: "Test: invalid inputs and error handling"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # A minimal project isolates each negative test on its target
      # input; the placeholder password below is a test literal, not
      # a real credential
      - name: "Create minimal project fixture"
        shell: bash
        run: |
          # Create minimal project fixture
          mkdir -p fake-project
          printf '%s\n' \
            '{"name": "fake-project", "version": "1.0.0"}' \
            > fake-project/package.json

      - name: "Running local action with shell metacharacters"
        id: bad-version
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: '1.0.0;rm -rf /'
          dry_run: 'true'

      - name: "Running local action with newline injection"
        id: newline-version
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: |
            1.0.0
            9.9.9-injected
          dry_run: 'true'

      - name: "Running local action with invalid registry URL"
        id: bad-registry
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          registry_url: 'https://nexus3.example.org/repository/npm'
          nexus_password: 'placeholder-not-a-secret'

      - name: "Running local action without credentials"
        id: no-credentials
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          registry_url: 'https://nexus3.example.org/repository/npm/'

      - name: "Running local action with workspace-escaping path"
        id: escape-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: /etc
          publish_version: '1.0.0'
          dry_run: 'true'

      - name: "Running local action with invalid tag"
        id: bad-tag
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          tag: 'not a tag'
          dry_run: 'true'

      - name: "Running local action with invalid access"
        id: bad-access
        continue-on-error: true
        uses: $/
        with:
          path_prefix: fake-project
          publish_version: '1.0.0'
          access: internal
          dry_run: 'true'

      - name: "Verify invalid inputs were rejected"
        shell: bash
        env:
          VERSION_OUTCOME: ${{ steps.bad-version.outcome }}
          NEWLINE_OUTCOME: ${{ steps.newline-version.outcome }}
          REGISTRY_OUTCOME: ${{ steps.bad-registry.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.no-credentials.outcome }}
          ESCAPE_OUTCOME: ${{ steps.escape-path.outcome }}
          TAG_OUTCOME: ${{ steps.bad-tag.outcome }}
          ACCESS_OUTCOME: ${{ steps.bad-access.outcome }}
        run: |
          # Failure testing is also important; all steps MUST fail
          errors=0
          for outcome_pair in \
            "version:${VERSION_OUTCOME}" \
            "newline:${NEWLINE_OUTCOME}" \
            "registry:${REGISTRY_OUTCOME}" \
            "credentials:${CREDENTIALS_OUTCOME}" \
            "escape:${ESCAPE_OUTCOME}" \
            "tag:${TAG_OUTCOME}" \
            "access:${ACCESS_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" = "success" ]; then
              echo "Invalid ${test_name} unexpectedly succeeded ❌"
              errors=1
            fi
          done
          # The rejected inputs must leave package.json untouched
          stamped="$(jq -r '.version // empty' \
            fake-project/package.json)"
          if [ "${stamped}" != "1.0.0" ]; then
            echo "Rejected input still stamped a version ❌"
            echo "package.json version: ${stamped}"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Failure-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid inputs correctly rejected ✅"
          echo "Invalid inputs correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test version lifecycle scripts stay suppressed ###
  test-lifecycle-hooks:
    name: "Test: version lifecycle scripts do not run"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Each hook writes a marker file. Their absence after the run
      # proves --ignore-scripts suppressed them, rather than the hook
      # merely producing no visible output.
      - name: "Create project fixture with version lifecycle hooks"
        shell: bash
        run: |
          # Create project fixture with version lifecycle hooks
          mkdir -p hook-project
          cat > hook-project/package.json << 'FIXTURE'
          {
            "name": "hook-project",
            "version": "1.0.0",
            "scripts": {
              "preversion": "touch preversion.marker",
              "version": "touch version.marker",
              "postversion": "touch postversion.marker"
            }
          }
          FIXTURE
          jq -e . hook-project/package.json > /dev/null

      - name: "Run local action against the hook fixture"
        id: hooks
        uses: $/
        with:
          path_prefix: hook-project
          publish_version: '2.3.4'
          node_version: '22'
          dry_run: 'true'

      - name: "Verify hooks stayed suppressed and version stamped"
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ steps.hooks.outputs.published_version }}
        run: |
          # Verify hooks stayed suppressed and the version still stamped
          errors=0
          for hook in preversion version postversion; do
            if [ -f "hook-project/${hook}.marker" ]; then
              echo "Lifecycle script '${hook}' ran despite" \
                "--ignore-scripts ❌"
              errors=1
            fi
          done
          # Suppression must not cost the stamp itself
          stamped="$(jq -r '.version // empty' \
            hook-project/package.json)"
          if [ "${stamped}" != "2.3.4" ]; then
            echo "Version stamp not applied ❌"
            echo "package.json version: ${stamped}"
            errors=1
          fi
          if [ "${PUBLISHED_VERSION}" != "2.3.4" ]; then
            echo "Unexpected published_version ❌"
            echo "Output: ${PUBLISHED_VERSION}"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Lifecycle suppression tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Version lifecycle scripts correctly suppressed ✅"
          echo "Version lifecycle scripts correctly suppressed ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test that publishing never fans out across a workspace ###
  # The unit tests stamp workspace fixtures through real npm, but never
  # run the shipped action against one. Run it whole, in dry-run mode,
  # and assert it reports the target package alone.
  #
  # Two workspace children, deliberately. With one, npm reports a
  # single entry either way and only the *name* differs; with two,
  # dropping the flag makes npm emit an entry per child. So the case
  # discriminates against both regressions independently: without the
  # flag the fan-out guard rejects two entries and the action fails,
  # and without the guard as well the reported package is a child
  # rather than the target.
  test-workspace-publish:
    name: "Test: publishing ignores sibling workspace packages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Create a workspace fixture with two children"
        shell: bash
        run: |
          # Create a workspace fixture with two children
          mkdir -p ws-project/packages/a ws-project/packages/b
          # These names reach npm during the dry run, which queries
          # the registry for an existing version. Names anyone could
          # register would fail CI without a code change, so use ones
          # nobody is plausibly going to claim.
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-fixture",' \
            ' "version": "1.0.0", "workspaces": ["packages/*"]}' \
            > ws-project/package.json
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-child-a",' \
            ' "version": "1.0.0"}' \
            > ws-project/packages/a/package.json
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-ws-child-b",' \
            ' "version": "1.0.0"}' \
            > ws-project/packages/b/package.json
          for manifest in ws-project/package.json \
            ws-project/packages/a/package.json \
            ws-project/packages/b/package.json; do
            jq -e . "${manifest}" > /dev/null
          done

      - name: "Dry-run publish from the workspace root"
        id: ws-publish
        uses: $/
        with:
          path_prefix: ws-project
          publish_version: '9.9.9'
          dry_run: 'true'

      # A workspace selected through the environment is the one
      # source npm refuses alongside --no-workspaces, so validation
      # rejects it rather than letting the stamp fail. Nothing else
      # covers that branch in the shipped action: the .npmrc selector
      # case in test/publish.test.ts reaches npm through a different
      # route entirely.
      #
      # Set in upper case deliberately. npm matches the npm_config_
      # prefix case insensitively and callers naturally write
      # environment variables this way, so the check folds case
      # before comparing; a literal lower-case comparison would miss
      # the form people actually use.
      - name: "Workspace selected via environment [expected failure]"
        id: ws-env
        continue-on-error: true
        env:
          NPM_CONFIG_WORKSPACE: 'packages/a'
        uses: $/
        with:
          path_prefix: ws-project
          publish_version: '5.5.5'
          dry_run: 'true'

      - name: "Verify only the target package was published"
        shell: bash
        env:
          NAME: ${{ steps.ws-publish.outputs.package_name }}
          VERSION: ${{ steps.ws-publish.outputs.published_version }}
          WS_ENV: ${{ steps.ws-env.outcome }}
        run: |
          # Verify only the target package was published
          errors=0
          want='lfreleng-node-publish-action-ws-fixture'
          if [ "${NAME}" != "${want}" ]; then
            echo "Reported package was '${NAME}', expected" \
              "'${want}' ❌"
            errors=1
          fi
          if [ "${VERSION}" != "9.9.9" ]; then
            echo "Reported version was '${VERSION}', expected" \
              "9.9.9 ❌"
            errors=1
          fi
          # The stamp is workspace confined too, so the children must
          # still carry their own versions
          for child in a b; do
            child_version="$(jq -r '.version // empty' \
              "ws-project/packages/${child}/package.json")"
            if [ "${child_version}" != "1.0.0" ]; then
              echo "Child ${child} was rewritten to" \
                "${child_version} ❌"
              errors=1
            fi
          done
          # The environment selector must fail during validation,
          # before the stamp. Asserting the outcome alone would not
          # discriminate, so check the version never moved to the one
          # that case requested: a regression letting the run reach
          # the stamp would leave 5.5.5 behind.
          if [ "${WS_ENV}" != "failure" ]; then
            echo "NPM_CONFIG_WORKSPACE selection was accepted ❌"
            errors=1
          fi
          root_version="$(jq -r '.version // empty' \
            ws-project/package.json)"
          if [ "${root_version}" = "5.5.5" ]; then
            echo "Environment selector was caught after the stamp ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Workspace publish tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Publishing confined to the target package ✅"
          echo "Publishing confined to the target package ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test authentication mode validation ###
  # CI has no registry credentials and completes no publish, so
  # tests use dry-run mode wherever the path under test allows it.
  # The token pass-through case cannot be a dry run, because dry-run
  # mode skips the very step it exercises: the .npmrc generation.
  test-auth-modes:
    name: "Test: authentication mode validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create minimal project fixtures"
        shell: bash
        run: |
          # Create minimal project fixtures
          mkdir -p auth-project
          # The package name reaches npm during the dry runs below,
          # which query the registry for an existing version. An
          # obvious name like 'auth-project' could be registered by
          # anyone and would then fail CI without a code change, so
          # use one nobody is plausibly going to claim.
          printf '%s\n' \
            '{"name": "lfreleng-node-publish-action-test-fixture",' \
            ' "version": "1.0.0"}' \
            > auth-project/package.json
          jq -e . auth-project/package.json > /dev/null
          # Fixture for the token pass-through case, kept separate so
          # the .npmrc written into it belongs to that case alone
          mkdir -p token-project
          printf '%s\n' \
            '{"name": "token-project", "version": "1.0.0"}' \
            > token-project/package.json
          jq -e . token-project/package.json > /dev/null

      # Ambiguous credentials must fail rather than silently pick one.
      # The token below is a test literal, not a real credential.
      #
      # These conflict cases run in dry-run mode, so the validation
      # branch under test is the only thing standing between the
      # invocation and success. Dry-run mode skips the credential
      # steps, so if validation stopped rejecting these they would
      # succeed rather than fail for some unrelated reason.
      - name: "Token plus password [expected failure]"
        id: token-and-password
        continue-on-error: true
        uses: $/
        with:
          path_prefix: auth-project
          publish_version: '1.0.0'
          registry_url: 'https://registry.npmjs.org/'
          auth_token: 'npm_testTOKEN0123456789abcdefGHIJKLM'
          nexus_password: 'testpass'
          dry_run: 'true'

      # Basic auth has two routes into the mode counter, and only one
      # of them is a password. Without this case, removing the
      # INPUT_LOAD_CREDENTIAL half of that condition would leave
      # every other test green while two credential modes were
      # accepted at once.
      #
      # Dry-run mode also skips the vault_mapping_json and
      # op_service_account_token requirement, so nothing but the mode
      # conflict can fail this.
      - name: "Token plus load_credential [expected failure]"
        id: token-and-load
        continue-on-error: true
        uses: $/
        with:
          path_prefix: auth-project
          publish_version: '1.0.0'
          registry_url: 'https://registry.npmjs.org/'
          auth_token: 'npm_testTOKEN0123456789abcdefGHIJKLM'
          load_credential: 'true'
          dry_run: 'true'

      # Every other auth_token case is rejected during validation, so
      # nothing exercises the pass-through to node-create-npmrc-action
      # on a valid configuration: a typo in that forwarding would
      # leave CI green while token publishing was broken.
      #
      # This case authenticates for real and then fails at the
      # publish, because the registry host does not exist (.invalid is
      # reserved by RFC 2606, so it resolves nowhere and the harden
      # step blocks it regardless). The failure is the point: the
      # .npmrc is written before the publish is attempted, and the
      # scrub runs as a post-job step, so the file is still on disk
      # for the assertion below.
      - name: "Token auth writes an authenticated .npmrc"
        id: token-npmrc
        continue-on-error: true
        uses: $/
        with:
          path_prefix: token-project
          publish_version: '1.0.0'
          registry_url: 'https://registry.example.invalid/'
          auth_token: 'npm_testTOKEN0123456789abcdefGHIJKLM'
          # nexus_user carries no secret and selects no mode, so it
          # must not conflict with token auth -- callers computing it
          # unconditionally across a Nexus/npmjs matrix depend on
          # that. Supplying it here keeps the exception covered.
          nexus_user: 'testuser'

      - name: "Verify the token reached the .npmrc"
        shell: bash
        run: |
          # Verify the token reached the .npmrc
          errors=0
          # Compare the complete line rather than just the key.
          # Asserting that '_authToken=' appears somewhere would
          # still pass if the forwarding picked up the wrong input --
          # nexus_user is deliberately non-empty in this case, so a
          # mix-up would produce a plausible-looking entry. grep -qxF
          # keeps the value out of the log: the token is a test
          # literal, but printing credential material in CI output is
          # a bad habit to encode in a test.
          want='//registry.example.invalid/:_authToken='
          want="${want}npm_testTOKEN0123456789abcdefGHIJKLM"
          if [ ! -f token-project/.npmrc ]; then
            echo "Token auth wrote no .npmrc ❌"
            errors=1
          elif ! grep -qxF -- "${want}" token-project/.npmrc; then
            echo "The .npmrc carries no _authToken line holding the" \
              "token that was supplied ❌"
            errors=1
          fi
          # A password entry would mean the wrong mode was selected
          if [ -f token-project/.npmrc ] && \
            grep -q '_auth=' token-project/.npmrc; then
            echo "Token auth wrote a Basic auth entry ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Token pass-through test failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Token reached the generated .npmrc ✅"
          echo "Token reached the generated .npmrc ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "Verify nexus_user never conflicts with a mode"
        shell: bash
        run: |
          # Verify nexus_user never conflicts with a mode
          # The token case above supplied nexus_user too. It reached
          # the .npmrc step, so the username was accepted rather than
          # rejected as a conflicting mode.
          if [ ! -f token-project/.npmrc ]; then
            echo "token plus nexus_user was rejected ❌"
            echo "nexus_user exception test failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "nexus_user accepted alongside token auth ✅"
          echo "nexus_user accepted alongside token auth ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "Verify every invalid combination was rejected"
        shell: bash
        env:
          TOKEN_AND_PASSWORD: ${{ steps.token-and-password.outcome }}
          TOKEN_AND_LOAD: ${{ steps.token-and-load.outcome }}
        run: |
          # Verify every invalid combination was rejected
          errors=0
          for pair in \
            "token+password:${TOKEN_AND_PASSWORD}" \
            "token+load_credential:${TOKEN_AND_LOAD}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            if [ "${outcome}" != "failure" ]; then
              echo "Combination '${name}' was accepted ❌"
              errors=1
            fi
          done
          if [ "${errors}" != "0" ]; then
            echo "Authentication mode tests failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid authentication modes correctly rejected ✅"
          echo "Invalid authentication modes correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Unit tests for the TypeScript sources ###
  # The publish-output parser has no jq equivalent: it locates npm's JSON
  # inside a stream that lifecycle scripts also write to, then normalises
  # two npm generations' shapes. Testing it as a function removes the need
  # to extract a fragment of action.yaml and run it against fixtures.
  test-unit:
    name: "Test: TypeScript unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js"
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: "Install dependencies"
        shell: bash
        run: |
          # Install dependencies
          npm ci --no-audit --no-fund

      - name: "Type check"
        shell: bash
        run: |
          # Type check
          npm run typecheck

      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          npm test

  ### Load npm's internals from every supported npm major ###
  # The action loads pickRegistry and @npmcli/config from the npm that will
  # publish, rather than bundling or transcribing them. That layout is not
  # a public API, so exercise it on each major the action supports. A
  # relocation in a new npm then fails here, naming the npm, instead of in
  # a consumer's publish.
  test-npm-internals:
    name: "Test: npm internals across npm majors"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js"
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: "Install dependencies"
        shell: bash
        run: |
          # Install dependencies
          npm ci --no-audit --no-fund

      - name: "Install each npm side by side"
        shell: bash
        run: |
          # Install each npm side by side
          # One directory per npm, each from its own committed lockfile, so
          # every run exercises the same npm builds: resolving npm@6 afresh
          # would test whatever shipped last. None is installed globally,
          # so the npm on PATH stays the toolchain's. npm 6 predates
          # @npmcli/config and covers registry selection alone; the suite
          # gates the rest by version.
          dirs=()
          for fixture in test/npm-versions/*/; do
            npm ci --prefix "$fixture" --no-audit --no-fund --ignore-scripts
            dirs+=("${GITHUB_WORKSPACE}/${fixture}node_modules/npm")
          done
          IFS=':'
          echo "NPM_INTERNALS_DIRS=${dirs[*]}" >> "$GITHUB_ENV"

      - name: "Run the loader and parity tests against each npm"
        shell: bash
        run: |
          # Run the loader and parity tests against each npm
          # Parity runs npm publish --dry-run offline against .invalid
          # hosts, so nothing is contacted.
          npx vitest run test/npm-internals.real.test.ts \
            test/registry.parity.test.ts

  ### Verify the committed bundle matches the sources ###
  # GitHub runs this action straight from the repository, so dist/ has to
  # be committed. That makes it possible for the bundle to drift from src/,
  # and a reviewer reading the diff would see the sources change while the
  # code that actually runs did not. Rebuild and compare.
  check-dist:
    name: "Test: committed bundle matches sources"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js"
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: "Rebuild and compare against the committed bundle"
        shell: bash
        run: |
          # Rebuild and compare against the committed bundle
          npm ci --no-audit --no-fund
          npm run build
          # git diff sees modified tracked files only, so a build that
          # emits a *new* artefact nobody committed would slip through.
          # --porcelain with --untracked-files=all reports additions,
          # modifications and deletions alike.
          drift="$(git status --porcelain --untracked-files=all -- dist/)"
          if [ -n "${drift}" ]; then
            echo "The committed bundle differs from a fresh build ❌"
            printf '%s\n' "${drift}"
            echo "Run 'npm run build' and commit the result."
            echo "Committed bundle is stale ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Committed bundle matches the sources ✅"
          echo "Committed bundle matches the sources ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test that lifecycle output cannot corrupt the parsed metadata ###
  # npm runs lifecycle scripts with inherited stdio, so their output lands
  # in the same stream the action captures for npm's JSON. Nothing else in
  # this workflow trips it: test-lifecycle-hooks uses 'touch', and the
  # fixtures elsewhere are silent by accident rather than by design.
  #
  # The hooks here reproduce what broke the jq parse: an unbalanced brace,
  # a hook's own JSON object, and a stray closing brace, both before and
  # after npm's report.
  test-lifecycle-output:
    name: "Test: lifecycle output does not corrupt metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Create a fixture whose hooks write to stdout"
        shell: bash
        run: |
          # Create a fixture whose hooks write to stdout
          mkdir -p noisy-project
          # A separate script keeps the noise out of package.json, where
          # the escaping would be unreadable. It reproduces what broke the
          # jq parse: an unbalanced brace, a JSON object of the hook's
          # own, and a stray closing brace.
          cat > noisy-project/noise.js << 'NOISE'
          const phase = process.argv[2];
          if (phase === 'pre') {
            console.log('building... {unbalanced');
            console.log(JSON.stringify({ tool: 'webpack', ok: true }));
          } else {
            console.log('cleanup done }');
            console.log(JSON.stringify({ stats: { seconds: 12 } }));
          }
          NOISE
          cat > noisy-project/package.json << 'FIXTURE'
          {
            "name": "lfreleng-node-publish-action-noisy-fixture",
            "version": "1.0.0",
            "scripts": {
              "prepublishOnly": "node noise.js pre",
              "postpublish": "node noise.js post"
            }
          }
          FIXTURE
          jq -e . noisy-project/package.json > /dev/null

      - name: "Publish with noisy hooks"
        id: noisy
        uses: $/
        with:
          path_prefix: noisy-project
          publish_version: '4.4.4'
          dry_run: 'true'

      - name: "Verify the metadata survived the hook output"
        shell: bash
        env:
          NAME: ${{ steps.noisy.outputs.package_name }}
          VERSION: ${{ steps.noisy.outputs.published_version }}
          TARBALL: ${{ steps.noisy.outputs.tarball_name }}
        run: |
          # Verify the metadata survived the hook output
          errors=0
          want='lfreleng-node-publish-action-noisy-fixture'
          if [ "${NAME}" != "${want}" ]; then
            echo "Reported package was '${NAME}', expected '${want}' ❌"
            errors=1
          fi
          if [ "${VERSION}" != "4.4.4" ]; then
            echo "Reported version was '${VERSION}', expected 4.4.4 ❌"
            errors=1
          fi
          # The hook's own JSON carries no filename, so an empty tarball
          # would mean the parser picked the wrong object rather than
          # merely failing to find one.
          if [ "${TARBALL}" != "${want}-4.4.4.tgz" ]; then
            echo "Reported tarball was '${TARBALL}' ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Lifecycle output corrupted the metadata ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Metadata parsed correctly despite hook output ✅"
          echo "Metadata parsed correctly despite hook output ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  test-tarball-publish:
    name: "Test: publishing a pre-packed tarball"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two packages, deliberately different. The tarball is packed
      # from 'packed' while the action points path_prefix at 'project',
      # so a run that ignored tarball_path and packed the directory
      # would report the wrong name and version rather than passing by
      # coincidence.
      - name: "Build a decoy project and a separate tarball"
        shell: bash
        run: |
          # Build a decoy project and a separate tarball
          mkdir -p project packed
          cat > project/package.json <<'JSON'
          {"name":"decoy-project","version":"0.0.1","license":"Apache-2.0"}
          JSON
          cat > packed/package.json <<'JSON'
          {"name":"packed-package","version":"3.2.1","license":"Apache-2.0"}
          JSON
          ( cd packed && npm pack --pack-destination .. )
          ls -1 ./*.tgz

      - name: "Running local action: publish the packed tarball"
        id: publish
        uses: $/
        with:
          path_prefix: project
          tarball_path: packed-package-3.2.1.tgz
          publish_version: '3.2.1'
          node_version: '22'
          dry_run: 'true'

      - name: "Verify the tarball published, not the directory"
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
          TARBALL_NAME: ${{ steps.publish.outputs.tarball_name }}
        run: |
          # Verify the tarball published, not the directory
          errors=0
          if [ "${PACKAGE_NAME}" != "packed-package" ]; then
            echo "Published '${PACKAGE_NAME}', expected the tarball ❌"
            errors=1
          fi
          if [ "${PUBLISHED_VERSION}" != "3.2.1" ]; then
            echo "Published version '${PUBLISHED_VERSION}' ❌"
            errors=1
          fi
          if [ "${TARBALL_NAME}" != "packed-package-3.2.1.tgz" ]; then
            echo "Reported tarball '${TARBALL_NAME}' ❌"
            errors=1
          fi
          # The decoy must be untouched. Publishing it would show up
          # above, but the stamp is a separate failure: skipping it is
          # what keeps the published bytes identical to the attested
          # ones, so assert the manifest was not rewritten.
          decoy="$(jq -r '.version // empty' project/package.json)"
          if [ "${decoy}" != "0.0.1" ]; then
            echo "The stamp ran and rewrote the project ❌"
            echo "project/package.json version: ${decoy}"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Pre-packed tarball publish failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Pre-packed tarball published, stamp skipped ✅"
          echo "Pre-packed tarball published, stamp skipped ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  test-scoped-registry:
    name: "Test: scoped registry overrides"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@807a544b7e55a9224b2b3780e636467bd4b5b99b' # v0.5.0

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The unit tests cover the selection rules. This exercises the
      # halves they cannot: reading a real .npmrc through npm's own
      # config resolution, and the committed bundle the action runs.
      - name: "Resolve against real npm configuration"
        shell: bash
        run: |
          # Resolve against real npm configuration
          resolver="${GITHUB_WORKSPACE}/dist/prepare/index.js"
          input='https://nexus3.example.org/repository/npm.release/'
          scoped='https://scoped.example.org/repo/'
          manifest='https://from-manifest.example.org/'
          errors=0

          # $1 label, $2 expected registry, $3 expected source,
          # $4 expected scope ('' for an unscoped package)
          #
          # The project lives under RUNNER_TEMP, so that is the workspace
          # the bundle confines it to. A dry run needs no credential, which
          # leaves resolution as the only thing that can fail.
          run_case() {
            local label="$1" want="$2" want_source="$3" want_scope="${4:-}"
            local out="${RUNNER_TEMP}/case-out.txt"
            : > "${out}"
            set +e
            log="$(GITHUB_WORKSPACE="${RUNNER_TEMP}" \
              INPUT_PATH_PREFIX=proj INPUT_REGISTRY_URL="${input}" \
              INPUT_TARBALL_PATH="${TARBALL:-}" \
              INPUT_PUBLISH_VERSION="${VERSION:-1.0.0}" \
              INPUT_DRY_RUN=true INPUT_NODE_VERSION=22 INPUT_TAG=latest \
              INPUT_PROVENANCE=false INPUT_LOAD_CREDENTIAL=false \
              GITHUB_OUTPUT="${out}" node "${resolver}" 2>&1)"
            rc=$?
            set -e
            if [ "${want}" = 'reject' ]; then
              if [ "${rc}" = "0" ]; then
                echo "${label}: expected rejection, resolver succeeded ❌"
                errors=1
              elif ! printf '%s' "${log}" | grep -q '^::error::'; then
                echo "${label}: rejected without a labelled error ❌"
                errors=1
              fi
              return
            fi
            if [ "${rc}" != "0" ]; then
              echo "${label}: resolver failed ❌"
              printf '%s\n' "${log}" | tail -2
              errors=1
              return
            fi
            # Outputs use the heredoc form, so the value is the line
            # after its key rather than a key=value pair.
            got="$(grep -A1 '^registry<<' "${out}" | tail -1)"
            got_source="$(grep -A1 '^registry_source<<' "${out}" | tail -1)"
            if [ "${got}" != "${want}" ]; then
              echo "${label}: resolved '${got}', expected '${want}' ❌"
              errors=1
            fi
            if [ "${got_source}" != "${want_source}" ]; then
              echo "${label}: source '${got_source}'," \
                "expected '${want_source}' ❌"
              errors=1
            fi
            # Every consulted scope is pinned by the publish and the
            # verification, so a missing one silently lets a project
            # key redirect npm view. Stated per case rather than
            # inferred from the label: 'unscoped' contains 'scoped'.
            # Every line between the heredoc delimiters, joined with a
            # space for comparison. A single-line read would see only
            # the first scope and miss a dropped second one -- exactly
            # the regression this exists to catch.
            got_scope="$(awk '/^registry_scopes<</{f=1;next}
              f&&/^ghadelimiter_/{f=0} f' \
              "${out}" | paste -sd' ' -)"
            if [ "${got_scope}" != "${want_scope}" ]; then
              echo "${label}: scopes '${got_scope}'," \
                "expected '${want_scope}' ❌"
              errors=1
            fi
          }

          mkdir -p "${RUNNER_TEMP}/proj"
          write_manifest() {
            printf '%s' "$1" > "${RUNNER_TEMP}/proj/package.json"
          }

          # Unscoped package, nothing set: the input stands.
          rm -f "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"plain","version":"1.0.0"}'
          run_case 'unscoped default' "${input}" input ''

          # Scoped package with a real .npmrc. This is the case the unit
          # tests cannot reach: the value comes back through npm's own
          # configuration resolution, not a literal supplied by a test.
          printf '@onap:registry=%s\n' "${scoped}" \
            > "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"@onap/ui-common","version":"1.0.0"}'
          run_case 'npmrc scoped' "${scoped}" npm-config-scoped '@onap'

          # publishConfig outranks the .npmrc entry, because npm
          # flattens it over the resolved options.
          write_manifest '{"name":"@onap/ui-common","version":"1.0.0",
            "publishConfig":{"@onap:registry":"'"${manifest}"'"}}'
          run_case 'publishConfig wins' "${manifest}" \
            publishConfig-scoped '@onap'

          # A scoped entry must not redirect an unscoped package.
          write_manifest '{"name":"plain","version":"1.0.0"}'
          run_case 'scoped ignored when unscoped' "${input}" input ''

          # An override arrives from the project's own files, so it gets
          # the scheme check registry_url receives.
          rm -f "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"@onap/ui-common","version":"1.0.0",
            "publishConfig":{"@onap:registry":"http://evil.example/"}}'
          run_case 'http override refused' reject reject

          # pickRegistry consults npm's configured 'scope' after the
          # package's own, so an unscoped package is redirected too.
          # This needs real npm config, which the unit tests cannot
          # supply.
          printf 'scope=@onap\n@onap:registry=%s\n' "${scoped}" \
            > "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"plain","version":"1.0.0"}'
          run_case 'configured scope fallback' "${scoped}" \
            npm-config-scoped '@onap'

          # Two consulted scopes at once: the package's own, and a
          # different configured one. Both must come back, because the
          # publish and verification pin every line of this output --
          # a dropped second scope re-enables a registry npm consults.
          # Only a real bundle run over real npm config can show the
          # multi-line output survives end to end.
          printf 'scope=@other\n@other:registry=%s\n' "${scoped}" \
            > "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"@onap/ui-common","version":"1.0.0"}'
          run_case 'two consulted scopes' "${scoped}" \
            npm-config-scoped '@onap @other'

          # publishConfig.scope flattens into opts.scope, so it redirects
          # an unscoped package and outranks the configured scope.
          rm -f "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"plain","version":"1.0.0",
            "publishConfig":{"scope":"@other",
              "@other:registry":"'"${scoped}"'"}}'
          run_case 'publishConfig.scope redirects' "${scoped}" \
            publishConfig-scoped '@other'

          # A present but empty publishConfig key masks the .npmrc
          # value: npm flattens it over the resolved options, so the
          # selection moves past it rather than falling back.
          printf '@onap:registry=%s\n' "${scoped}" \
            > "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"@onap/ui-common","version":"1.0.0",
            "publishConfig":{"@onap:registry":""}}'
          run_case 'empty publishConfig key masks npmrc' "${input}" \
            input '@onap'

          # A tarball publish resolves from the manifest inside the
          # archive, because that is the one npm reads. Reading the
          # working directory here would resolve the registry from a
          # manifest nothing publishes -- and a caller packing
          # elsewhere would never notice.
          rm -f "${RUNNER_TEMP}/proj/.npmrc"
          write_manifest '{"name":"decoy","version":"0.0.1"}'
          mkdir -p "${RUNNER_TEMP}/archive"
          cat > "${RUNNER_TEMP}/archive/package.json" <<'JSON'
          {"name":"@onap/from-tarball","version":"9.9.9",
           "publishConfig":
             {"@onap:registry":"https://from-tarball.example.org/"}}
          JSON
          ( cd "${RUNNER_TEMP}/archive" \
            && npm pack --pack-destination "${RUNNER_TEMP}" \
              >/dev/null 2>&1 )
          export TARBALL="${RUNNER_TEMP}/onap-from-tarball-9.9.9.tgz"
          export VERSION=9.9.9
          run_case 'tarball manifest wins' \
            'https://from-tarball.example.org/' publishConfig-scoped '@onap'
          unset TARBALL VERSION

          if [ "${errors}" != "0" ]; then
            echo "Scoped registry resolution failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Scoped registry resolution correct ✅"
          echo "Scoped registry resolution correct ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      # Running the bundle proves the rules; it says nothing about the
      # action consuming them. Reverting either REGISTRY_URL assignment
      # would restore the original false-reporting defect with every
      # check above still green, so the wiring is asserted directly.
      - name: "Assert the action consumes the resolved registry"
        shell: bash
        run: |
          # Assert the action consumes the resolved registry
          python3 - <<'PY'
          import sys

          import yaml

          with open('action.yaml') as handle:
              steps = yaml.safe_load(handle)['runs']['steps']

          by_id = {s.get('id'): s for s in steps if s.get('id')}
          resolved = '${' + '{ steps.prepare.outputs.registry }' + '}'
          state = '${' + '{ steps.prepare.outputs.state }' + '}'
          errors = []


          def env_of(step_id):
              return (by_id.get(step_id, {}).get('env') or {})


          for step_id in ('prepare', 'publish'):
              if step_id not in by_id:
                  errors.append(f"no step with id '{step_id}' in action.yaml")

          # The prepare step must read the raw input, since it is the thing
          # being resolved -- pointing it at its own output would be a
          # silent no-op.
          raw = '${' + '{ inputs.registry_url }' + '}'
          got = str(env_of('prepare').get('INPUT_REGISTRY_URL', '')).strip()
          if got != raw:
              errors.append(
                  f'the prepare step reads registry_url as {got!r}, '
                  f'expected {raw!r}'
              )

          # The publish step takes everything from the state file. Which
          # flags npm receives is unit tested (test/publish-command.test.ts);
          # what is checked here is that the step reads the state prepare
          # wrote, and nothing that could bypass it.
          publish_env = env_of('publish')
          if publish_env != {'STATE': state}:
              errors.append(
                  f'the publish step env is {publish_env!r}, expected only '
                  f'STATE={state!r}; every decision must come from the state '
                  'file prepare checked'
              )

          # Each bundle proves the selected Node.js can run it before it is
          # relied on. For publish that is the difference between failing
          # before npm publishes and failing after.
          for step_id in ('prepare', 'publish'):
              body = str(by_id.get(step_id, {}).get('run', ''))
              if '--selftest' not in body:
                  errors.append(
                      f"the {step_id} step does not self-test its bundle "
                      'before using it'
                  )

          # Resolution must precede the .npmrc step, which replaces the
          # project's own file. Resolving afterwards would read this
          # action's credential file instead of the project's config, and
          # the credential would be keyed to the wrong registry -- a 401
          # that no test here would otherwise catch.
          names = [str(s.get('name', '')) for s in steps]
          try:
              resolve_at = names.index(
                  'Validate inputs and resolve the registry'
              )
              npmrc_at = names.index('Create authenticated .npmrc')
              publish_at = names.index('Stamp, publish and verify')
          except ValueError:
              errors.append('cannot find the prepare, .npmrc and publish steps')
          else:
              if not resolve_at < npmrc_at < publish_at:
                  errors.append(
                      'expected prepare, then the .npmrc step, then publish; '
                      'the .npmrc step replaces the project .npmrc, so '
                      'resolution must read it first'
                  )
          npmrc = [
              s for s in steps
              if 'npmrc' in str(s.get('name', '')).lower()
          ]
          if len(npmrc) == 1:
              keyed = str(
                  (npmrc[0].get('with') or {}).get('registry_url', '')
              ).strip()
              if keyed != resolved:
                  errors.append(
                      'the .npmrc step keys its credential to '
                      f'{keyed!r}, expected {resolved!r}; a publish '
                      'redirected by the project would reach a '
                      'registry with no credential'
                  )

          # The work directory holds the staged tarball and the state, and
          # a failed publish leaves it behind just as a successful one does.
          cleanup = [
              s for s in steps
              if 'work directory' in str(s.get('name', ''))
          ]
          if len(cleanup) != 1:
              errors.append(f'found {len(cleanup)} cleanup steps, expected one')
          else:
              condition = str(cleanup[0].get('if', ''))
              keyed_off_state = 'steps.prepare.outputs.state' in condition
              if 'always()' not in condition or not keyed_off_state:
                  errors.append(
                      f'the cleanup step runs if {condition!r}; it must run '
                      'always(), keyed off the state output'
                  )
          if errors:
              for message in errors:
                  print(f'::error::{message}')
              sys.exit('Registry wiring incorrect \u274c')

          print('Registry wiring correct \u2705')
          PY
          echo "Registry wiring correct \u2705" >> "$GITHUB_STEP_SUMMARY"

      # And the resolve step must actually run inside the action, which
      # only invoking the action can show. A dry run reaches it without
      # credentials or a registry.
      #
      # The override names registry.npmjs.org rather than an example
      # host: egress is blocked to the allow-list, and a dry run still
      # queries the selected registry for existing metadata, so an
      # unreachable one fails on DNS before the assertion is reached.
      # It still differs from registry_url, which is what the case
      # needs.
      - name: "Build a scoped fixture"
        shell: bash
        run: |
          # Build a scoped fixture
          mkdir -p scoped-fixture
          cat > scoped-fixture/package.json <<'JSON'
          {
            "name": "@onap/scoped-fixture",
            "version": "0.0.0",
            "license": "Apache-2.0",
            "publishConfig": {
              "@onap:registry": "https://registry.npmjs.org/"
            }
          }
          JSON

      - name: "Running local action: scoped override, dry run"
        id: scoped
        uses: $/
        with:
          path_prefix: scoped-fixture
          publish_version: '1.0.0'
          node_version: '22'
          dry_run: 'true'
          registry_url: 'https://nexus3.example.org/repository/npm.release/'

      - name: "Assert the action reported the override"
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.scoped.outputs.package_name }}
        run: |
          # Assert the action reported the override
          if [ "${PACKAGE_NAME}" != "@onap/scoped-fixture" ]; then
            echo "Published '${PACKAGE_NAME}', expected the fixture ❌"
            exit 1
          fi
          echo "Action ran the resolver against a scoped package ✅"
          echo "Action ran the resolver against a scoped package ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      # The check above is a smoke test. A resolver replaced by a no-op
      # leaves REGISTRY_URL empty, npm falls back to its own default,
      # and the fixture still packs -- so the assertion passes for the
      # wrong reason. This one cannot be satisfied without the resolver
      # running inside the action and reaching a verdict, because the
      # action must *fail*.
      - name: "Build a fixture with an unusable override"
        shell: bash
        run: |
          # Build a fixture with an unusable override
          mkdir -p refused-fixture
          cat > refused-fixture/package.json <<'JSON'
          {
            "name": "@onap/refused-fixture",
            "version": "0.0.0",
            "license": "Apache-2.0",
            "publishConfig": {
              "@onap:registry": "http://cleartext.example.org/"
            }
          }
          JSON

      - name: "Running local action: http override must fail"
        id: refused
        continue-on-error: true
        uses: $/
        with:
          path_prefix: refused-fixture
          publish_version: '1.0.0'
          node_version: '22'
          dry_run: 'true'
          registry_url: 'https://nexus3.example.org/repository/npm.release/'

      - name: "Assert the action refused the http override"
        shell: bash
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: |
          # Assert the action refused the http override
          if [ "${OUTCOME}" != "failure" ]; then
            echo "The action succeeded with an http registry override ❌"
            echo "Outcome was '${OUTCOME}'; the resolver either did not"
            echo "run inside the action or did not reject the override"
            exit 1
          fi
          echo "Action refused a cleartext registry override ✅"
          echo "Action refused a cleartext registry override ✅" \
            >> "$GITHUB_STEP_SUMMARY"
